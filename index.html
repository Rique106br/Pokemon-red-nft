<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Retro Games</title><style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: hidden;
}

button,
input {
    font-family: inherit;
}

#topbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px;

    background: #111;
    border-bottom: 1px solid #292929;
}

#logo {
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
}

#search {
    flex: 1;
    min-width: 0;

    padding: 10px 14px;

    border: 1px solid #333;
    border-radius: 10px;

    background: #1a1a1a;
    color: white;
    outline: none;
}

#systemButtons {
    display: flex;
    gap: 6px;
}

.systemButton {
    border: 0;
    border-radius: 9px;

    padding: 9px 12px;

    background: #222;
    color: white;

    cursor: pointer;
}

.systemButton.active {
    background: white;
    color: black;
}

#library {
    padding: 20px;
}

#libraryTitle {
    margin: 0 0 16px;
    font-size: 26px;
}

#status {
    margin: 20px 0;
    color: #aaa;
}

#games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
}

.game {
    display: block;

    padding: 18px;
    min-height: 110px;

    background: #151515;

    border: 1px solid #292929;
    border-radius: 14px;

    color: white;
    text-decoration: none;

    cursor: pointer;

    transition:
        transform .15s,
        background .15s,
        border-color .15s;
}

.game:hover {
    background: #202020;
    border-color: #555;
    transform: translateY(-2px);
}

.game:active {
    transform: scale(.98);
}

.gameIcon {
    font-size: 34px;
    margin-bottom: 10px;
}

.gameName {
    font-size: 17px;
    font-weight: bold;
    word-break: break-word;
}

.gameType {
    margin-top: 6px;
    font-size: 12px;
    color: #888;
}

#emulatorScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: none;

    background: #000;
}

#emulatorScreen.show {
    display: block;
}

#game {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;
}

#game canvas {
    max-width: 100%;
    max-height: 100%;
}

#backButton {
    position: fixed;

    top: 12px;
    left: 12px;

    z-index: 10001;

    display: none;

    padding: 10px 14px;

    border: 1px solid #444;
    border-radius: 10px;

    background: rgba(0,0,0,.75);
    color: white;

    font-size: 14px;

    cursor: pointer;

    backdrop-filter: blur(5px);
}

#backButton.show {
    display: block;
}

#loading {
    position: fixed;
    inset: 0;

    z-index: 10000;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: #000;
}

#loading.show {
    display: flex;
}

.loader {
    width: 40px;
    height: 40px;

    border: 4px solid #333;
    border-top-color: white;

    border-radius: 50%;

    animation: spin 1s linear infinite;
}

#loadingText {
    margin-top: 15px;
    color: #aaa;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#crt {
    position: fixed;
    inset: 0;

    z-index: 9998;

    pointer-events: none;

    display: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 3px
        );

    mix-blend-mode: overlay;
}

#crt.show {
    display: block;
}

@media (max-width: 650px) {

    #topbar {
        flex-wrap: wrap;
    }

    #logo {
        width: 100%;
    }

    #search {
        order: 2;
        width: 100%;
        flex-basis: 100%;
    }

    #systemButtons {
        order: 3;
        width: 100%;
    }

    .systemButton {
        flex: 1;
    }

    #library {
        padding: 14px;
    }

    #games {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .game {
        min-height: 100px;
        padding: 14px;
    }
}

:fullscreen {
    background: #000;
}

:-webkit-full-screen {
    background: #000;
}
</style></head><body><div id="topbar"><div id="logo">
    🎮 Retro Games
</div>

<input
    id="search"
    type="search"
    placeholder="Pesquisar jogo..."
    autocomplete="off"
>

<div id="systemButtons">

    <button
        class="systemButton active"
        data-system="gb">
        Game Boy
    </button>

    <button
        class="systemButton"
        data-system="snes">
        SNES
    </button>

</div>

</div><div id="library"><h1 id="libraryTitle">
    Game Boy
</h1>

<div id="status">
    Carregando jogos...
</div>

<div id="games"></div>

</div><div id="emulatorScreen"><div id="game"></div>

</div><button id="backButton">
    ← Voltar
</button><div id="loading"><div class="loader"></div>

<div id="loadingText">
    Carregando jogo...
</div>

</div><div id="crt"></div><script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const GITHUB_USER = "Rique106br";
const GITHUB_REPO = "Pokemon-red-nft";

const BASE_PATH = "/Pokemon-red-nft/";

const GITHUB_API =
    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;

const SYSTEMS = {

    gb: {
        name: "Game Boy",
        folder: "gb",
        core: "gb",
        icon: "🟢",

        extensions: [
            ".gb",
            ".gbc"
        ]
    },

    snes: {
        name: "SNES",
        folder: "snes",
        core: "snes",
        icon: "🎮",

        extensions: [
            ".sfc",
            ".smc",
            ".fig",
            ".swc",
            ".bsx"
        ]
    }

};


/* =========================================================
   ELEMENTOS
========================================================= */

const library =
    document.getElementById("library");

const topbar =
    document.getElementById("topbar");

const gamesContainer =
    document.getElementById("games");

const status =
    document.getElementById("status");

const libraryTitle =
    document.getElementById("libraryTitle");

const search =
    document.getElementById("search");

const emulatorScreen =
    document.getElementById("emulatorScreen");

const backButton =
    document.getElementById("backButton");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const crt =
    document.getElementById("crt");


let currentSystem = "gb";
let allGames = [];


/* =========================================================
   NORMALIZAR NOME
========================================================= */

function normalizeGameName(filename) {

    let name =
        filename.replace(/\.[^/.]+$/, "");

    name =
        name.replace(/[_-]+/g, " ");

    name =
        name.replace(/\s+/g, " ");

    return name
        .trim()
        .replace(/\b\w/g, c => c.toUpperCase());
}


/* =========================================================
   CRIAR SLUG
========================================================= */

function createSlug(filename) {

    let name =
        filename.replace(/\.[^/.]+$/, "");

    return name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   URL CURTA
========================================================= */

function buildGamePath(game) {

    return (
        BASE_PATH +
        game.system +
        "/" +
        encodeURIComponent(game.slug)
    );

}


/* =========================================================
   CARREGAR JOGOS
========================================================= */

async function loadGames(system) {

    const config =
        SYSTEMS[system];

    gamesContainer.innerHTML = "";

    status.textContent =
        `Procurando jogos em /${config.folder}/...`;

    try {

        const response =
            await fetch(
                GITHUB_API +
                config.folder
            );

        if (!response.ok) {

            throw new Error(
                "Erro GitHub API: " +
                response.status
            );

        }

        const files =
            await response.json();

        allGames =
            files
                .filter(file => {

                    if (
                        file.type !== "file"
                    ) {
                        return false;
                    }

                    const name =
                        file.name.toLowerCase();

                    return config.extensions.some(
                        ext =>
                            name.endsWith(ext)
                    );

                })
                .map(file => {

                    return {

                        name:
                            normalizeGameName(
                                file.name
                            ),

                        filename:
                            file.name,

                        slug:
                            createSlug(
                                file.name
                            ),

                        downloadUrl:
                            file.download_url,

                        system:
                            system

                    };

                });

        renderGames();

    } catch (error) {

        console.error(error);

        status.textContent =
            "Erro ao carregar os jogos.";

    }

}


/* =========================================================
   MOSTRAR JOGOS
========================================================= */

function renderGames() {

    const query =
        search.value
            .trim()
            .toLowerCase();

    gamesContainer.innerHTML = "";

    const filtered =
        allGames.filter(game =>
            game.name
                .toLowerCase()
                .includes(query)
        );

    if (!filtered.length) {

        status.textContent =
            "Nenhum jogo encontrado.";

        return;

    }

    status.textContent =
        `${filtered.length} jogo${filtered.length > 1 ? "s" : ""} encontrado${filtered.length > 1 ? "s" : ""}.`;


    filtered.forEach(game => {

        const card =
            document.createElement("a");

        card.className =
            "game";

        /*
         * ESTE É O LINK CURTO
         */

        card.href =
            buildGamePath(game);

        card.innerHTML = `

            <div class="gameIcon">
                ${SYSTEMS[game.system].icon}
            </div>

            <div class="gameName">
                ${escapeHtml(game.name)}
            </div>

            <div class="gameType">
                ${SYSTEMS[game.system].name}
            </div>

        `;


        card.addEventListener(
            "click",
            event => {

                event.preventDefault();

                /*
                 * Fullscreen dentro do toque
                 */

                requestFullscreen();


                /*
                 * Salva a URL curta
                 */

                history.pushState(
                    {
                        game: true
                    },
                    "",
                    buildGamePath(game)
                );


                /*
                 * Inicia o jogo
                 */

                startEmulator(
                    game.downloadUrl,
                    game.system,
                    game.name
                );

            }
        );


        gamesContainer.appendChild(card);

    });

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function requestFullscreen() {

    try {

        if (
            document.fullscreenElement ||
            document.webkitFullscreenElement
        ) {
            return;
        }

        if (
            document.documentElement
                .requestFullscreen
        ) {

            await document.documentElement
                .requestFullscreen();

        } else if (
            document.documentElement
                .webkitRequestFullscreen
        ) {

            document.documentElement
                .webkitRequestFullscreen();

        }

    } catch (error) {

        console.log(
            "Fullscreen bloqueado:",
            error
        );

    }

}


/* =========================================================
   INICIAR EMULATORJS
========================================================= */

function startEmulator(
    rom,
    system,
    name
) {

    if (!rom) {
        return;
    }

    const config =
        SYSTEMS[system];


    library.style.display =
        "none";

    topbar.style.display =
        "none";

    emulatorScreen.classList.add(
        "show"
    );

    backButton.classList.add(
        "show"
    );

    loading.classList.add(
        "show"
    );

    loadingText.textContent =
        `Carregando ${name}...`;


    if (system === "snes") {

        crt.classList.add(
            "show"
        );

    } else {

        crt.classList.remove(
            "show"
        );

    }


    document.getElementById(
        "game"
    ).innerHTML = "";


    /*
     * EmulatorJS
     */

    window.EJS_player =
        "#game";

    window.EJS_core =
        config.core;

    window.EJS_gameUrl =
        rom;

    window.EJS_gameName =
        name;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_mouse =
        false;

    window.EJS_multitap =
        false;

    /*
     * Controles virtuais
     */

    window.EJS_virtualGamepad =
        true;


    /*
     * Remove loader antigo
     */

    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );

    if (oldLoader) {
        oldLoader.remove();
    }


    /*
     * Carrega EmulatorJS
     */

    const script =
        document.createElement("script");

    script.id =
        "emulatorjs-loader";

    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.async = true;

    script.onload = () => {

        loading.classList.remove(
            "show"
        );

    };

    document.body.appendChild(
        script
    );

}


/* =========================================================
   ABRIR PELA URL
========================================================= */

async function openGameFromUrl() {

    const path =
        window.location.pathname;


    /*
     * Remove a parte:
     *
     * /Pokemon-red-nft/
     */

    if (
        !path.startsWith(BASE_PATH)
    ) {
        return false;
    }


    const relative =
        path
            .slice(BASE_PATH.length)
            .replace(/^\/+|\/+$/g, "");


    const parts =
        relative.split("/");


    if (parts.length !== 2) {
        return false;
    }


    const system =
        parts[0].toLowerCase();

    const slug =
        decodeURIComponent(parts[1]);


    if (!SYSTEMS[system]) {
        return false;
    }


    try {

        const response =
            await fetch(
                GITHUB_API +
                SYSTEMS[system].folder
            );

        if (!response.ok) {
            return false;
        }


        const files =
            await response.json();


        const file =
            files.find(item => {

                if (
                    item.type !== "file"
                ) {
                    return false;
                }


                const name =
                    item.name.toLowerCase();


                if (
                    !SYSTEMS[system]
                        .extensions
                        .some(ext =>
                            name.endsWith(ext)
                        )
                ) {
                    return false;
                }


                return (
                    createSlug(item.name) ===
                    slug
                );

            });


        if (!file) {
            return false;
        }


        currentSystem =
            system;


        startEmulator(
            file.download_url,
            system,
            normalizeGameName(
                file.name
            )
        );


        return true;

    } catch (error) {

        console.error(error);

        return false;

    }

}


/* =========================================================
   VOLTAR
========================================================= */

async function backToLibrary() {

    const game =
        document.getElementById(
            "game"
        );

    game.innerHTML = "";


    const loader =
        document.getElementById(
            "emulatorjs-loader"
        );

    if (loader) {
        loader.remove();
    }


    emulatorScreen.classList.remove(
        "show"
    );

    backButton.classList.remove(
        "show"
    );

    loading.classList.remove(
        "show"
    );

    crt.classList.remove(
        "show"
    );


    topbar.style.display =
        "";

    library.style.display =
        "";


    history.pushState(
        {},
        "",
        BASE_PATH
    );


    await exitFullscreen();


    loadGames(
        currentSystem
    );

}


/* =========================================================
   SAIR DO FULLSCREEN
========================================================= */

async function exitFullscreen() {

    try {

        if (
            document.fullscreenElement
        ) {

            await document.exitFullscreen();

        } else if (
            document.webkitFullscreenElement
        ) {

            document.webkitExitFullscreen();

        }

    } catch (error) {

        console.log(error);

    }

}


/* =========================================================
   BOTÃO VOLTAR
========================================================= */

backButton.addEventListener(
    "click",
    backToLibrary
);


/* =========================================================
   PESQUISA
========================================================= */

search.addEventListener(
    "input",
    renderGames
);


/* =========================================================
   TROCAR SISTEMA
========================================================= */

document
    .querySelectorAll(".systemButton")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                currentSystem =
                    button.dataset.system;


                document
                    .querySelectorAll(
                        ".systemButton"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );


                button.classList.add(
                    "active"
                );


                libraryTitle.textContent =
                    SYSTEMS[
                        currentSystem
                    ].name;


                search.value = "";


                loadGames(
                    currentSystem
                );

            }
        );

    });


/* =========================================================
   HISTÓRICO DO NAVEGADOR
========================================================= */

window.addEventListener(
    "popstate",
    async () => {

        const opened =
            await openGameFromUrl();

        if (!opened) {

            emulatorScreen.classList.remove(
                "show"
            );

            backButton.classList.remove(
                "show"
            );

            topbar.style.display =
                "";

            library.style.display =
                "";

            loadGames(
                currentSystem
            );

        }

    }
);


/* =========================================================
   INICIAR SITE
========================================================= */

async function init() {

    /*
     * Primeiro tenta descobrir se a URL
     * atual é de um jogo.
     */

    const opened =
        await openGameFromUrl();


    /*
     * Se não for, abre a biblioteca.
     */

    if (!opened) {

        loadGames(
            "gb"
        );

    }

}


init();

</script></body>
</html>
