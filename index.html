<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy NFC Emulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script type="text/javascript">
        // Pega a ROM passada via parâmetro da URL (?rom=...) ou usa uma padrão
        const urlParams = new URLSearchParams(window.location.search);
        const romUrl = urlParams.get('rom') || 'https://archive.org/download/Pokemon-red-and-blue/Pok%C3%A9mon%20-%20Red%20Version%20%28USA%2C%20Europe%29.gb';

        EJS_player = "#game";
        EJS_core = "gb"; // Núcleo de Game Boy / Game Boy Color
        EJS_gameName = "Pokémon Red";
        EJS_color = "#e52521";
        EJS_startOnLoaded = true; // Inicia automaticamente assim que carregar
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/"; // Usa a CDN oficial do EmulatorJS
        EJS_gameUrl = romUrl;
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
