<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste ROM</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;
}

#status {
    margin: 30px auto;
    padding: 20px;
    max-width: 500px;
    border-radius: 12px;
    background: #222;
    font-size: 18px;
}

.ok {
    color: #00ff66;
}

.erro {
    color: #ff3333;
}

button {
    padding: 14px 20px;
    margin: 10px;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>Teste do Pokémon FireRed</h1>

<div id="status">
    Verificando ROM...
</div>

<button onclick="location.href='?jogar=1'">
    Tentar iniciar jogo
</button>

<script>

const rom = "gba/pokemon_firered.gba";

const status = document.getElementById("status");

fetch(rom, {
    method: "HEAD",
    cache: "no-store"
})
.then(response => {

    if (!response.ok) {

        status.className = "erro";

        status.innerHTML =
            "❌ ROM NÃO ENCONTRADA<br><br>" +
            "HTTP: " + response.status +
            "<br><br>" +
            "Caminho procurado:<br>" +
            rom;

        return;
    }

    status.className = "ok";

    status.innerHTML =
        "✅ ROM ENCONTRADA!<br><br>" +
        "HTTP: " + response.status +
        "<br><br>" +
        "O arquivo está sendo encontrado pelo GitHub Pages.";

})
.catch(error => {

    status.className = "erro";

    status.innerHTML =
        "❌ ERRO AO ACESSAR ROM<br><br>" +
        error;

});

</script>

</body>
</html>
