<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Retro Games</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   MENU
========================= */

#menu {
    height: 58px;
    min-height: 58px;
    background: #111;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 1000;
}

.logo {
    font-weight: 900;
    letter-spacing: 2px;
    font-size: 20px;
}

.games {
    display: flex;
    gap: 8px;
}

.games button {
    border: 1px solid #555;
    background: #222;
    color: white;
    padding: 9px 12px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.games button:hover {
    background: #333;
}

.games button.active {
    background: #fff;
    color: #000;
}

/* =========================
   EMULATOR
========================= */

#game {
    position: relative;
    width: 100%;
    height: calc(100vh - 58px);
    background: #000;
    overflow: hidden;
}

/*
   O EmulatorJS vai criar o canvas,
   controles touch e menu dentro deste elemento.
*/

#game canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

/* =========================
   CRT
========================= */

#crt {
    pointer-events: none;
    position: fixed;
    left: 0;
    right: 0;
    top: 58px;
    bottom: 0;

    z-index: 900;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,0,0,0.00) 0px,
            rgba(0,0,0,0.00) 2px,
            rgba(0,0,0,0.13) 3px
        );

    box-shadow:
        inset 0 0 80px rgba(0,0,0,0.55);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    #menu {
        height: 50px;
        min-height: 50px;
        padding: 0 9px;
    }

    .logo {
        font-size: 15px;
    }

    .games button {
        font-size: 11px;
        padding: 7px 8px;
    }

    #game {
        height: calc(100vh - 50px);
    }

    #crt {
        top: 50px;
    }
}
</style>
</head>

<body>

<header id="menu">

    <div class="logo">
        RETRO
    </div>

    <div class="games">

        <button
            id="gbButton"
            onclick="loadGame('gb')">
            Pokémon Red
        </button>

        <button
            id="gbaButton"
            onclick="loadGame('gba')">
            Pokémon FireRed
        </button>

    </div>

</header>

<div id="game"></div>

<div id="crt"></div>


<script>

/* =========================================================
   CONFIGURAÇÃO DOS JOGOS
========================================================= */

const games = {

    gb: {
        name: "Pokemon Red",
        core: "gb",
        rom: "gb/pokemon_red.gb"
    },

    gba: {
        name: "Pokemon FireRed",
        core: "gba",
        rom: "gba/pokemon_firered.gba"
    }

};


/* =========================================================
   LÊ O JOGO PELA URL
========================================================= */

const params = new URLSearchParams(window.location.search);

let selectedGame = params.get("game") || "gb";

if (!games[selectedGame]) {
    selectedGame = "gb";
}


/* =========================================================
   CARREGA EMULATORJS
========================================================= */

function loadGame(gameId) {

    const game = games[gameId];

    if (!game) {
        return;
    }

    selectedGame = gameId;

    /*
     * Atualiza URL sem recarregar a página
     */
    const newUrl =
        window.location.pathname +
        "?game=" +
        encodeURIComponent(gameId);

    window.history.replaceState({}, "", newUrl);


    /*
     * Botões
     */

    document
        .getElementById("gbButton")
        .classList.toggle("active", gameId === "gb");

    document
        .getElementById("gbaButton")
        .classList.toggle("active", gameId === "gba");


    /*
     * Limpa emulador anterior
     */

    document.getElementById("game").innerHTML = "";


    /*
     * Variáveis oficiais do EmulatorJS
     */

    window.EJS_player = "#game";

    window.EJS_core = game.core;

    window.EJS_gameUrl = game.rom;

    /*
     * Data do EmulatorJS
     */
    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    /*
     * Nome do jogo
     */
    window.EJS_gameName = game.name;

    /*
     * Começa automaticamente
     */
    window.EJS_startOnLoaded = true;

    /*
     * Controle virtual para celular
     */
    window.EJS_VirtualGamepadSettings = [];

    /*
     * Usa o esquema de controles correto.
     */
    window.EJS_controlScheme = game.core;

    /*
     * Cor da interface
     */
    window.EJS_color = "#e0e0e0";

    /*
     * Idioma
     */
    window.EJS_language = 7;


    /*
     * Garante que o loader antigo seja removido.
     */

    const oldLoader =
        document.getElementById("emulatorjs-loader");

    if (oldLoader) {
        oldLoader.remove();
    }


    /*
     * Carrega EmulatorJS
     */

    const script = document.createElement("script");

    script.id = "emulatorjs-loader";

    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.async = true;

    document.body.appendChild(script);
}


/* =========================================================
   INICIA
========================================================= */

document.addEventListener("DOMContentLoaded", function () {

    loadGame(selectedGame);

});

</script>

</body>
</html>
