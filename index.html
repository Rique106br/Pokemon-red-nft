<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>RETRO GAMES</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}


/* =====================================================
   MENU
===================================================== */

#topbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 58px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 14px;

    background: #111;

    border-bottom:
        1px solid #333;

    z-index: 100000;

}

.logo {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 3px;

}

.games {

    display: flex;

    gap: 8px;

}

.games a {

    color: white;

    background: #222;

    border:
        1px solid #555;

    border-radius: 8px;

    padding:
        9px 12px;

    text-decoration: none;

    font-size: 14px;

    font-weight: bold;

}

.games a.active {

    background: white;

    color: black;

}


/* =====================================================
   EMULATOR
===================================================== */

#game {

    position: fixed;

    top: 58px;
    left: 0;

    width: 100%;

    height:
        calc(100% - 58px);

    background: #000;

    overflow: hidden;

}


/*
   O EmulatorJS coloca o canvas aqui.
*/

#game canvas {

    image-rendering:
        pixelated;

}


/* =====================================================
   CRT
===================================================== */

#crt {

    position: fixed;

    top: 58px;
    left: 0;

    width: 100%;

    height:
        calc(100% - 58px);

    pointer-events: none;

    z-index: 90000;

    background:

        repeating-linear-gradient(

            to bottom,

            rgba(0,0,0,0)
            0px,

            rgba(0,0,0,0)
            2px,

            rgba(0,0,0,0.10)
            3px

        );

    box-shadow:

        inset 0 0 90px
        rgba(0,0,0,0.45);

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    #topbar {

        height: 50px;

        padding:
            0 8px;

    }

    .logo {

        font-size: 16px;

        letter-spacing: 2px;

    }

    .games {

        gap: 5px;

    }

    .games a {

        font-size: 11px;

        padding:
            8px 8px;

    }

    #game {

        top: 50px;

        height:
            calc(100% - 50px);

    }

    #crt {

        top: 50px;

        height:
            calc(100% - 50px);

    }

}

</style>

</head>


<body>


<!-- =====================================================
     MENU
===================================================== -->

<header id="topbar">

    <div class="logo">
        RETRO
    </div>

    <nav class="games">

        <a
            id="redButton"
            href="?game=red">

            Pokémon Red

        </a>

        <a
            id="fireButton"
            href="?game=firered">

            Pokémon FireRed

        </a>

    </nav>

</header>


<!-- =====================================================
     EMULATORJS
===================================================== -->

<div id="game"></div>


<!-- =====================================================
     CRT
===================================================== -->

<div id="crt"></div>


<script>

/* =====================================================
   ESCOLHER JOGO
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const selected =
    params.get("game") || "red";


/* =====================================================
   CONFIGURAÇÃO DOS JOGOS
===================================================== */

const games = {

    red: {

        name:
            "Pokémon Red",

        rom:
            "gb/pokemon_red.gb",

        core:
            "gb"

    },

    firered: {

        name:
            "Pokémon FireRed",

        rom:
            "gba/pokemon_firered.gba",

        core:
            "mgba"

    }

};


/* =====================================================
   JOGO ATUAL
===================================================== */

const current =
    games[selected] || games.red;


/* =====================================================
   BOTÃO ATIVO
===================================================== */

if (selected === "firered") {

    document
        .getElementById(
            "fireButton"
        )
        .classList
        .add("active");

} else {

    document
        .getElementById(
            "redButton"
        )
        .classList
        .add("active");

}


/* =====================================================
   CONFIGURAÇÃO OFICIAL EMULATORJS
===================================================== */


/*
   Elemento onde o emulator será criado.
*/

window.EJS_player =
    "#game";


/*
   Sistema.

   gb  = Game Boy / Game Boy Color
   gba = Game Boy Advance
*/

window.EJS_core =
    current.core;


/*
   Seu ROM.

   O arquivo está no próprio GitHub Pages.
*/

window.EJS_gameUrl =
    current.rom;


/*
   Nome utilizado pelo EmulatorJS
   para saves e interface.
*/

window.EJS_gameName =
    current.name;


/*
   BIOS não é necessária
   para esses jogos.
*/

window.EJS_biosUrl =
    "";


/*
   Diretório oficial de dados.
*/

window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";


/*
   Inicia automaticamente.
*/

window.EJS_startOnLoaded =
    true;


/*
   Cor da interface.
*/

window.EJS_color =
    "#ffffff";


/*
   Idioma.

   Português.
*/

window.EJS_language =
    7;


/*
   IMPORTANTE:

   NÃO colocar:

   EJS_VirtualGamepadSettings = [];

   Assim o EmulatorJS pode usar
   o Virtual Gamepad padrão.
*/


/* =====================================================
   CARREGAR EMULATORJS
===================================================== */

const script =
    document.createElement("script");


script.src =
    "https://cdn.emulatorjs.org/stable/data/loader.js";


script.async =
    true;


document.body
    .appendChild(script);

</script>


</body>

</html>
