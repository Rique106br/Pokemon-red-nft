<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>RETRO GAMES</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #080808;
    color: white;

    font-family: Arial, sans-serif;
}

/* =========================
   MENU
========================= */

#topbar {

    position: sticky;

    top: 0;

    width: 100%;

    min-height: 58px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 8px 14px;

    background: #111;

    border-bottom: 1px solid #333;

    z-index: 10000;
}

.logo {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 3px;
}

.menu {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;

    justify-content: flex-end;
}

.menu a {

    color: white;

    background: #222;

    border: 1px solid #555;

    border-radius: 8px;

    padding: 9px 12px;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;
}

.menu a.active {

    background: white;

    color: black;
}


/* =========================
   LISTA
========================= */

#library {

    padding: 18px;

    max-width: 900px;

    margin: auto;
}

.title {

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 14px;
}

#search {

    width: 100%;

    padding: 14px;

    margin-bottom: 18px;

    background: #191919;

    color: white;

    border: 1px solid #444;

    border-radius: 9px;

    outline: none;

    font-size: 16px;
}

#search:focus {

    border-color: white;
}


/* =========================
   JOGOS
========================= */

.system {

    margin-bottom: 28px;
}

.system-title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;

    padding-bottom: 7px;

    border-bottom: 1px solid #333;
}

.games {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

    gap: 10px;
}

.game {

    display: block;

    padding: 15px;

    background: #1b1b1b;

    border: 1px solid #333;

    border-radius: 10px;

    color: white;

    text-decoration: none;

    transition: .15s;
}

.game:hover {

    background: #292929;

    transform: translateY(-1px);
}

.game-name {

    font-weight: bold;

    word-break: break-word;
}

.game-file {

    margin-top: 6px;

    color: #888;

    font-size: 11px;
}


/* =========================
   CARREGANDO
========================= */

#loading {

    text-align: center;

    padding: 40px 15px;

    color: #aaa;
}

#error {

    display: none;

    margin: 20px 0;

    padding: 15px;

    border-radius: 9px;

    background: #241111;

    border: 1px solid #6b2929;

    color: #ff7777;
}


/* =========================
   EMULADOR
========================= */

#emulator {

    position: fixed;

    inset: 0;

    background: black;

    z-index: 50000;

    display: none;
}

#game {

    width: 100%;

    height: 100%;
}


/* botão voltar */

#back {

    position: fixed;

    top: 10px;

    left: 10px;

    z-index: 100000;

    padding: 10px 14px;

    border: 0;

    border-radius: 8px;

    background: rgba(0,0,0,.75);

    color: white;

    font-weight: bold;

    display: none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    #topbar {

        min-height: 50px;

        padding: 7px 9px;
    }

    .logo {

        font-size: 16px;
    }

    .menu a {

        font-size: 11px;

        padding: 7px 8px;
    }

    #library {

        padding: 14px;
    }

    .games {

        grid-template-columns:
            repeat(2, 1fr);
    }

}

</style>

</head>

<body>


<!-- =========================
     MENU
========================= -->

<header id="topbar">

    <div class="logo">
        RETRO
    </div>

    <nav class="menu">

        <a href="#gb">
            GAME BOY
        </a>

        <a href="#snes">
            SNES
        </a>

    </nav>

</header>


<!-- =========================
     BIBLIOTECA
========================= -->

<main id="library">

    <div class="title">
        Biblioteca
    </div>

    <input
        id="search"
        type="search"
        placeholder="🔎 Procurar jogo..."
        autocomplete="off"
    >

    <div id="loading">
        Procurando jogos...
    </div>

    <div id="error"></div>

    <section
        id="gb"
        class="system"
        style="display:none">

        <div class="system-title">
            🎮 Game Boy
        </div>

        <div
            id="gbGames"
            class="games">
        </div>

    </section>


    <section
        id="snes"
        class="system"
        style="display:none">

        <div class="system-title">
            🕹️ Super Nintendo
        </div>

        <div
            id="snesGames"
            class="games">
        </div>

    </section>

</main>


<!-- =========================
     EMULADOR
========================= -->

<div id="emulator">

    <button id="back"
            onclick="closeGame()">
        ← Voltar
    </button>

    <div id="game"></div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO DO REPOSITÓRIO
===================================================== */

/*
   Seu site é:

   rique106br.github.io/Pokemon

   Então:

   usuário = rique106br
   repositório = Pokemon
*/

const GITHUB_USER =
    "Rique106br";

const GITHUB_REPO =
    "Pokemon-red-nft";


/* =====================================================
   EXTENSÕES
===================================================== */

const extensions = {

    gb: [
        ".gb",
        ".gbc"
    ],

    snes: [
        ".sfc",
        ".smc",
        ".fig",
        ".swc",
        ".bsx"
    ]

};


/* =====================================================
   DADOS
===================================================== */

let allGames = [];


/* =====================================================
   PEGAR ARQUIVOS DO GITHUB
===================================================== */

async function getFolder(folder) {

    const url =
        "https://api.github.com/repos/" +
        GITHUB_USER +
        "/" +
        GITHUB_REPO +
        "/contents/" +
        folder;

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "Não foi possível acessar a pasta " +
            folder +
            " (" +
            response.status +
            ")"
        );

    }

    const files =
        await response.json();

    return files.filter(file =>
        file.type === "file"
    );

}


/* =====================================================
   VER EXTENSÃO
===================================================== */

function isValid(file, system) {

    const name =
        file.name.toLowerCase();

    return extensions[system]
        .some(ext =>
            name.endsWith(ext)
        );
}


/* =====================================================
   NOME BONITO
===================================================== */

function cleanName(filename) {

    return filename
        .replace(/\.(gb|gbc|sfc|smc|fig|swc|bsx)$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\b\w/g, c =>
            c.toUpperCase()
        );

}


/* =====================================================
   CRIAR CARD
===================================================== */

function createGame(file, system) {

    const card =
        document.createElement("a");

    card.className =
        "game";

    card.href =
        "?play=" +
        encodeURIComponent(
            file.download_url
        ) +
        "&core=" +
        system +
        "&name=" +
        encodeURIComponent(
            cleanName(file.name)
        );

    card.innerHTML =

        '<div class="game-name">' +

        cleanName(file.name) +

        '</div>' +

        '<div class="game-file">' +

        file.name +

        '</div>';

    return card;
}


/* =====================================================
   MOSTRAR JOGOS
===================================================== */

function renderGames() {

    const gbBox =
        document.getElementById(
            "gbGames"
        );

    const snesBox =
        document.getElementById(
            "snesGames"
        );

    gbBox.innerHTML = "";
    snesBox.innerHTML = "";

    let gbCount = 0;
    let snesCount = 0;

    allGames.forEach(game => {

        const card =
            createGame(
                game.file,
                game.system
            );

        if (game.system === "gb") {

            gbBox.appendChild(card);

            gbCount++;

        }

        if (game.system === "snes") {

            snesBox.appendChild(card);

            snesCount++;

        }

    });


    document.getElementById("gb")
        .style.display =
        gbCount ? "block" : "none";


    document.getElementById("snes")
        .style.display =
        snesCount ? "block" : "none";

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function() {

            const query =
                this.value
                    .toLowerCase()
                    .trim();

            document
                .querySelectorAll(".game")
                .forEach(card => {

                    const text =
                        card.innerText
                            .toLowerCase();

                    card.style.display =
                        text.includes(query)
                            ? "block"
                            : "none";

                });

        }
    );


/* =====================================================
   PROCURAR AUTOMATICAMENTE
===================================================== */

async function scanGames() {

    try {

        document.getElementById(
            "loading"
        ).style.display =
            "block";


        /*
         * Procura GB e SNES
         * ao mesmo tempo.
         */

        const [gb, snes] =
            await Promise.all([

                getFolder("gb"),

                getFolder("snes")

            ]);


        /*
         * GB
         */

        gb
            .filter(file =>
                isValid(file, "gb")
            )
            .forEach(file => {

                allGames.push({

                    system: "gb",

                    file: file

                });

            });


        /*
         * SNES
         */

        snes
            .filter(file =>
                isValid(file, "snes")
            )
            .forEach(file => {

                allGames.push({

                    system: "snes",

                    file: file

                });

            });


        renderGames();


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        if (allGames.length === 0) {

            showError(
                "Nenhum ROM encontrado nas pastas gb/ e snes/."
            );

        }

    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "loading"
        ).style.display =
            "none";

        showError(
            "Não consegui procurar os ROMs.<br><br>" +
            error.message
        );

    }

}


/* =====================================================
   ERRO
===================================================== */

function showError(message) {

    const box =
        document.getElementById(
            "error"
        );

    box.innerHTML =
        message;

    box.style.display =
        "block";

}


/* =====================================================
   INICIAR EMULADOR
===================================================== */

function startEmulator() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const rom =
        params.get("play");

    const core =
        params.get("core");

    const name =
        params.get("name") ||
        "Retro Game";


    /*
     * Não está jogando.
     */

    if (!rom) {

        scanGames();

        return;

    }


    /*
     * Esconde biblioteca.
     */

    document.getElementById(
        "library"
    ).style.display =
        "none";

    document.getElementById(
        "topbar"
    ).style.display =
        "none";


    /*
     * Mostra emulador.
     */

    document.getElementById(
        "emulator"
    ).style.display =
        "block";

    document.getElementById(
        "back"
    ).style.display =
        "block";


    /*
     * EmulatorJS
     */

    window.EJS_player =
        "#game";

    window.EJS_core =
        core;

    window.EJS_gameUrl =
        rom;

    window.EJS_gameName =
        name;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_biosUrl =
        "";

    window.EJS_language =
        7;

    window.EJS_color =
        "#ffffff";


    /*
     * SNES sem mouse
     */

    if (core === "snes") {

        window.EJS_mouse =
            false;

        window.EJS_multitap =
            false;

    }


    /*
     * Carrega EmulatorJS.
     */

    const script =
        document.createElement(
            "script"
        );

    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.async =
        true;

    document.body
        .appendChild(script);

}


/* =====================================================
   VOLTAR
===================================================== */

function closeGame() {

    window.location.href =
        window.location.pathname;

}


/* =====================================================
   INICIAR
===================================================== */

startEmulator();

</script>

</body>

</html>
