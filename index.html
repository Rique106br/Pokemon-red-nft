<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Retro Player</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(
            circle at center,
            #252525 0%,
            #0b0b0b 55%,
            #000 100%
        );
}


/* ================================
   APP
================================ */

#app {
    width: 100%;
    height: 100%;
}


/* ================================
   TOPO
================================ */

#topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 52px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 14px;

    background: rgba(0,0,0,.9);

    border-bottom: 1px solid #333;

    z-index: 100;
}

#logo {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
}

#game-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);

    font-size: 13px;
    color: #aaa;

    max-width: 45vw;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.buttons {
    display: flex;
    gap: 6px;
}

button {
    border: 1px solid #444;

    background: #222;

    color: white;

    padding: 8px 11px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 12px;
}

button:active {
    transform: scale(.94);
}


/* ================================
   ÁREA DO JOGO
================================ */

#game-container {
    position: fixed;

    top: 52px;
    left: 0;
    right: 0;
    bottom: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    overflow: hidden;
}


/* ================================
   EMULADOR
================================ */

#emulator {
    width: 100%;
    height: 100%;

    border: 0;

    background: #000;
}


/* ================================
   CRT
================================ */

#crt {
    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 20;

    display: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            rgba(0,0,0,.13) 2px,
            rgba(0,0,0,.13) 4px
        );
}


/* brilho/vinheta */

#crt::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 50%,
            rgba(0,0,0,.18) 72%,
            rgba(0,0,0,.6) 100%
        );
}


/* ================================
   MENU
================================ */

#menu {
    position: fixed;

    inset: 0;

    z-index: 200;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #1d1d1d,
            #050505 70%
        );
}

.menu-box {
    width: min(92vw, 480px);

    padding: 30px;

    border-radius: 16px;

    background: #131313;

    border: 1px solid #333;

    box-shadow:
        0 30px 80px rgba(0,0,0,.8);

    text-align: center;
}

.menu-box h1 {
    margin: 0 0 8px;

    font-size: 28px;
}

.menu-box p {
    margin: 0 0 25px;

    color: #888;
}

.game-list {
    display: grid;

    gap: 10px;
}

.game {
    width: 100%;

    padding: 16px;

    text-align: left;

    background: #1e1e1e;

    border: 1px solid #333;

    border-radius: 10px;

    font-size: 15px;
}

.game:hover {
    background: #292929;
}

.game small {
    display: block;

    margin-top: 5px;

    color: #777;
}


/* ================================
   CARREGANDO
================================ */

#loading {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.9);
}

.loader {
    text-align: center;
}

.spinner {
    width: 45px;
    height: 45px;

    margin: 0 auto 15px;

    border: 4px solid #333;

    border-top-color: white;

    border-radius: 50%;

    animation:
        spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* ================================
   MOBILE
================================ */

@media(max-width:700px) {

    #topbar {
        height: 48px;
        padding: 0 8px;
    }

    #logo {
        font-size: 12px;
    }

    #game-title {
        display: none;
    }

    #game-container {
        top: 48px;
    }

    button {
        padding: 7px 9px;
    }
}
</style>
</head>


<body>


<!-- =================================
     APP
================================= -->

<div id="app">


    <!-- TOPO -->

    <div id="topbar">

        <div id="logo">
            RETRO
        </div>

        <div id="game-title">
            Nenhum jogo
        </div>

        <div class="buttons">

            <button onclick="toggleCRT()">
                CRT
            </button>

            <button onclick="fullscreen()">
                ⛶
            </button>

            <button onclick="showMenu()">
                ☰
            </button>

        </div>

    </div>


    <!-- JOGO -->

    <div id="game-container">

        <iframe
            id="emulator"
            title="Retro Emulator"
            allow="
                autoplay;
                fullscreen;
                gamepad;
                clipboard-read;
                clipboard-write
            "
            allowfullscreen>
        </iframe>

        <div id="crt"></div>

    </div>

</div>



<!-- =================================
     MENU
================================= -->

<div id="menu">

    <div class="menu-box">

        <h1>
            🎮 RETRO PLAYER
        </h1>

        <p>
            Game Boy • Game Boy Color • Game Boy Advance
        </p>


        <div class="game-list">


            <!-- ========================
                 POKÉMON RED
            ========================= -->

            <button
                class="game"
                onclick="startGame('pokemon-red')">

                🔴 Pokémon Red

                <small>
                    Game Boy • visual GBC
                </small>

            </button>


            <!-- ========================
                 POKÉMON FIRE RED
            ========================= -->

            <button
                class="game"
                onclick="startGame('pokemon-firered')">

                🔥 Pokémon FireRed

                <small>
                    Game Boy Advance • CRT
                </small>

            </button>


        </div>

    </div>

</div>



<!-- =================================
     LOADING
================================= -->

<div id="loading">

    <div class="loader">

        <div class="spinner"></div>

        <div>
            Carregando jogo...
        </div>

    </div>

</div>



<script>

/*
==========================================================
 JOGOS
==========================================================
*/

const games = {

    "pokemon-red": {

        title: "Pokémon Red",

        /*
         * Caminho da ROM dentro do seu GitHub Pages.
         */

        rom: "gb/pokemon_red.gb",

        /*
         * mGBA é o core que o WebRetro usa
         * para GB/GBC/GBA.
         */

        core: "mgba",

        crt: false

    },


    "pokemon-firered": {

        title: "Pokémon FireRed",

        rom: "gba/pokemon_firered.gba",

        core: "mgba",

        crt: true

    }

};


/*
==========================================================
 WEBRETRO
==========================================================
*/

const WEBRETRO =
    "https://binbashbanana.github.io/webretro/";


/*
==========================================================
 ELEMENTOS
==========================================================
*/

const emulator =
    document.getElementById("emulator");

const menu =
    document.getElementById("menu");

const loading =
    document.getElementById("loading");

const title =
    document.getElementById("game-title");

const crt =
    document.getElementById("crt");


/*
==========================================================
 TRANSFORMA CAMINHO LOCAL EM URL ABSOLUTA
==========================================================
*/

function getRomURL(path) {

    /*
     * Se o site estiver em:
     *
     * https://usuario.github.io/retro/
     *
     * isto vai gerar:
     *
     * https://usuario.github.io/retro/gb/pokemon_red.gb
     *
     */

    return new URL(
        path,
        window.location.href
    ).href;

}


/*
==========================================================
 INICIAR JOGO
==========================================================
*/

function startGame(id) {

    const game = games[id];

    if (!game) {

        alert("Jogo não encontrado.");

        return;
    }


    /*
     * Mostra carregamento.
     */

    loading.style.display =
        "flex";


    /*
     * Nome do jogo.
     */

    title.textContent =
        game.title;


    /*
     * URL absoluta da ROM.
     */

    const romURL =
        getRomURL(game.rom);


    /*
     * Parâmetros do WebRetro.
     */

    const params =
        new URLSearchParams();


    params.set(
        "core",
        game.core
    );


    params.set(
        "rom",
        romURL
    );


    /*
     * Importante:
     *
     * O WebRetro precisa buscar a ROM
     * no endereço absoluto.
     */

    const emulatorURL =
        WEBRETRO +
        "?" +
        params.toString();


    /*
     * Carrega o emulador.
     */

    emulator.src =
        emulatorURL;


    /*
     * CRT:
     *
     * FireRed = ON
     * Pokémon Red = OFF
     */

    if (game.crt) {

        crt.style.display =
            "block";

    } else {

        crt.style.display =
            "none";

    }


    /*
     * Esconde menu.
     */

    menu.style.display =
        "none";


    /*
     * Salva o jogo atual.
     */

    localStorage.setItem(
        "retro-game",
        id
    );


    /*
     * Cria link individual.
     *
     * Exemplo:
     *
     * ?game=pokemon-red
     */

    const url =
        window.location.pathname +
        "?game=" +
        encodeURIComponent(id);


    history.replaceState(
        null,
        "",
        url
    );

}


/*
==========================================================
 QUANDO O IFRAME TERMINAR DE CARREGAR
==========================================================
*/

emulator.addEventListener(
    "load",
    function() {

        loading.style.display =
            "none";

    }
);


/*
==========================================================
 CRT
==========================================================
*/

let crtOn = true;


function toggleCRT() {

    crtOn = !crtOn;


    if (crtOn) {

        /*
         * Só mostra se o jogo atual
         * estiver configurado com CRT.
         */

        const id =
            getCurrentGame();

        if (
            id &&
            games[id] &&
            games[id].crt
        ) {

            crt.style.display =
                "block";

        }

    } else {

        crt.style.display =
            "none";

    }

}


/*
==========================================================
 DESCOBRIR JOGO ATUAL
==========================================================
*/

function getCurrentGame() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("game");

}


/*
==========================================================
 MENU
==========================================================
*/

function showMenu() {

    emulator.src =
        "about:blank";


    menu.style.display =
        "flex";


    title.textContent =
        "Nenhum jogo";


    crt.style.display =
        "none";


    history.replaceState(
        null,
        "",
        window.location.pathname
    );

}


/*
==========================================================
 FULLSCREEN
==========================================================
*/

function fullscreen() {

    const target =
        document.documentElement;


    if (
        !document.fullscreenElement
    ) {

        if (
            target.requestFullscreen
        ) {

            target.requestFullscreen();

        }

    } else {

        if (
            document.exitFullscreen
        ) {

            document.exitFullscreen();

        }

    }

}


/*
==========================================================
 ABRIR JOGO PELO LINK
==========================================================
*/

function loadFromLink() {

    const id =
        getCurrentGame();


    if (!id) {

        return;

    }


    if (!games[id]) {

        alert(
            "Esse jogo não existe no catálogo."
        );

        return;

    }


    startGame(id);

}


/*
==========================================================
 INICIALIZAÇÃO
==========================================================
*/

window.addEventListener(
    "DOMContentLoaded",
    function() {

        loadFromLink();

    }
);

</script>

</body>
</html>
