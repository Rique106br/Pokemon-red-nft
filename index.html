<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Red - Cartucho NFC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #status {
            z-index: 10;
            font-size: 18px;
            color: #ffca28;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="status">Baixando Pokémon Red do Archive.org...</div>
    <div id="game"></div>

    <script type="text/javascript">
        const archiveUrl = "https://archive.org/download/Pokemon-red-and-blue/Pok%C3%A9mon%20-%20Red%20Version%20%28USA%2C%20Europe%29.gb";
        
        // Passa o link por um bypass de CORS para o navegador aceitar o download
        const corsProxyUrl = "https://corsproxy.io/?" + encodeURIComponent(archiveUrl);

        fetch(corsProxyUrl)
            .then(response => {
                if (!response.ok) throw new Error("Não foi possível acessar a ROM via Proxy.");
                return response.blob();
            })
            .then(blob => {
                // Cria uma URL local em memória (blob:) contendo o arquivo .gb real
                const localRomUrl = URL.createObjectURL(blob);
                
                document.getElementById('status').style.display = 'none';

                // Configura o emulador para rodar direto da memória local
                window.EJS_player = "#game";
                window.EJS_core = "gb";
                window.EJS_gameName = "Pokémon Red";
                window.EJS_color = "#e52521";
                window.EJS_startOnLoaded = true;
                window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
                window.EJS_gameUrl = localRomUrl;

                // Carrega os scripts do emulador só agora que a ROM já está em memória
                const script = document.createElement('script');
                script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
                document.body.appendChild(script);
            })
            .catch(err => {
                document.getElementById('status').innerText = "Erro ao carregar o jogo: " + err.message;
                document.getElementById('status').style.color = "#ff5252";
            });
    </script>

</body>
</html>
