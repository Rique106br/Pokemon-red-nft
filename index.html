<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Retro Games</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: hidden;
}

button,
input {
    font-family: inherit;
}

/* =========================
   TOPO
========================= */

#topbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px;

    background: #111;
    border-bottom: 1px solid #292929;
}

#logo {
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
}

#search {
    flex: 1;

    min-width: 0;
    padding: 10px 14px;

    border: 1px solid #333;
    border-radius: 10px;

    background: #1a1a1a;
    color: white;
    outline: none;
}

#search:focus {
    border-color: #777;
}

#systemButtons {
    display: flex;
    gap: 6px;
}

.systemButton {
    border: 0;
    border-radius: 9px;

    padding: 9px 12px;

    background: #222;
    color: white;

    cursor: pointer;
}

.systemButton.active {
    background: white;
    color: black;
}

/* =========================
   BIBLIOTECA
========================= */

#library {
    padding: 20px;
}

#libraryTitle {
    margin: 0 0 16px;
    font-size: 26px;
}

#status {
    margin: 20px 0;
    color: #aaa;
}

#games {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

    gap: 15px;
}

.game {
    display: block;

    padding: 18px;

    min-height: 110px;

    background: #151515;

    border: 1px solid #292929;
    border-radius: 14px;

    color: white;
    text-decoration: none;

    cursor: pointer;

    transition:
        transform .15s,
        background .15s,
        border-color .15s;
}

.game:hover {
    background: #202020;
    border-color: #555;
    transform: translateY(-2px);
}

.game:active {
    transform: scale(.98);
}

.gameIcon {
    font-size: 34px;
    margin-bottom: 10px;
}

.gameName {
    font-size: 17px;
    font-weight: bold;

    word-break: break-word;
}

.gameType {
    margin-top: 6px;

    font-size: 12px;
    color: #888;
}

/* =========================
   EMULADOR
========================= */

#emulatorScreen {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    background: #000;
}

#emulatorScreen.show {
    display: block;
}

#game {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;
}

#game canvas {
    max-width: 100%;
    max-height: 100%;
}

/* =========================
   BOTÃO VOLTAR
========================= */

#backButton {
    position: fixed;

    top: 12px;
    left: 12px;

    z-index: 10001;

    display: none;

    padding: 10px 14px;

    border: 1px solid #444;
    border-radius: 10px;

    background: rgba(0,0,0,.75);
    color: white;

    font-size: 14px;

    cursor: pointer;

    backdrop-filter: blur(5px);
}

#backButton.show {
    display: block;
}

/* =========================
   CARREGANDO
========================= */

#loading {
    position: fixed;

    inset: 0;

    z-index: 10000;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: #000;
}

#loading.show {
    display: flex;
}

.loader {
    width: 40px;
    height: 40px;

    border: 4px solid #333;
    border-top-color: white;

    border-radius: 50%;

    animation: spin 1s linear infinite;
}

#loadingText {
    margin-top: 15px;
    color: #aaa;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   CRT
========================= */

#crt {
    position: fixed;

    inset: 0;

    z-index: 9998;

    pointer-events: none;

    display: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 3px
        );

    mix-blend-mode: overlay;
}

#crt.show {
    display: block;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    #topbar {
        flex-wrap: wrap;
    }

    #logo {
        width: 100%;
    }

    #search {
        order: 2;
        width: 100%;
        flex-basis: 100%;
    }

    #systemButtons {
        order: 3;
        width: 100%;
    }

    .systemButton {
        flex: 1;
    }

    #library {
        padding: 14px;
    }

    #games {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 10px;
    }

    .game {
        min-height: 100px;
        padding: 14px;
    }
}

/* =========================
   FULLSCREEN
========================= */

:fullscreen {
    background: #000;
}

:-webkit-full-screen {
    background: #000;
}
</style>
</head>

<body>

<!-- =========================
     BIBLIOTECA
========================= -->

<div id="topbar">

    <div id="logo">
        🎮 Retro Games
    </div>

    <input
        id="search"
        type="search"
        placeholder="Pesquisar jogo..."
        autocomplete="off"
    >

    <div id="systemButtons">

        <button
            class="systemButton active"
            data-system="gb">
            Game Boy
        </button>

        <button
            class="systemButton"
            data-system="snes">
            SNES
        </button>

    </div>

</div>


<div id="library">

    <h1 id="libraryTitle">
        Game Boy
    </h1>

    <div id="status">
        Carregando jogos...
    </div>

    <div id="games"></div>

</div>


<!-- =========================
     EMULADOR
========================= -->

<div id="emulatorScreen">

    <div id="game"></div>

</div>


<button id="backButton">
    ← Voltar
</button>


<div id="loading">

    <div class="loader"></div>

    <div id="loadingText">
        Carregando jogo...
    </div>

</div>


<div id="crt"></div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const GITHUB_USER = "Rique106br";
const GITHUB_REPO = "Pokemon-red-nft";

const GITHUB_API =
    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;

const SYSTEMS = {

    gb: {
        name: "Game Boy",
        folder: "gb",

        extensions: [
            ".gb",
            ".gbc"
        ],

        core: "gb",

        icon: "🟢"
    },

    snes: {
        name: "SNES",
        folder: "snes",

        extensions: [
            ".sfc",
            ".smc",
            ".fig",
            ".swc",
            ".bsx"
        ],

        core: "snes",

        icon: "🎮"
    }

};


/* =========================================================
   ELEMENTOS
========================================================= */

const library =
    document.getElementById("library");

const topbar =
    document.getElementById("topbar");

const gamesContainer =
    document.getElementById("games");

const status =
    document.getElementById("status");

const libraryTitle =
    document.getElementById("libraryTitle");

const search =
    document.getElementById("search");

const emulatorScreen =
    document.getElementById("emulatorScreen");

const backButton =
    document.getElementById("backButton");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const crt =
    document.getElementById("crt");


/* =========================================================
   ESTADO
========================================================= */

let currentSystem = "gb";

let allGames = [];

let emulatorStarted = false;


/* =========================================================
   NORMALIZAR NOME
========================================================= */

function normalizeGameName(filename) {

    let name = filename;

    // remove extensão
    name = name.replace(/\.[^/.]+$/, "");

    // troca separadores
    name = name.replace(/[_-]+/g, " ");

    // remove espaços duplicados
    name = name.replace(/\s+/g, " ");

    // capitalização
    name = name
        .trim()
        .replace(/\b\w/g, char => char.toUpperCase());

    return name;
}


/* =========================================================
   CRIAR SLUG
========================================================= */

function createSlug(filename) {

    let name =
        filename.replace(/\.[^/.]+$/, "");

    name = name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    name = name
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");

    return name;
}


/* =========================================================
   PEGAR ROMS DO GITHUB
========================================================= */

async function loadGames(system) {

    const config = SYSTEMS[system];

    gamesContainer.innerHTML = "";

    status.textContent =
        `Procurando jogos em /${config.folder}/ ...`;

    try {

        const response = await fetch(
            GITHUB_API + config.folder
        );

        if (!response.ok) {

            throw new Error(
                `GitHub API respondeu ${response.status}`
            );

        }

        const files = await response.json();

        allGames = files
            .filter(file => {

                if (file.type !== "file") {
                    return false;
                }

                const filename =
                    file.name.toLowerCase();

                return config.extensions.some(
                    extension =>
                        filename.endsWith(extension)
                );

            })
            .map(file => {

                return {

                    name:
                        normalizeGameName(file.name),

                    filename:
                        file.name,

                    slug:
                        createSlug(file.name),

                    downloadUrl:
                        file.download_url,

                    path:
                        file.path,

                    system:
                        system

                };

            });

        renderGames();

    } catch (error) {

        console.error(error);

        status.textContent =
            "Não foi possível carregar os jogos.";

        gamesContainer.innerHTML = `
            <div style="
                grid-column:1/-1;
                padding:20px;
                color:#aaa;
                background:#151515;
                border-radius:12px;
            ">
                Erro ao acessar a pasta
                <strong>/${config.folder}/</strong>.

                <br><br>

                Verifique se a pasta existe no GitHub.
            </div>
        `;

    }

}


/* =========================================================
   MOSTRAR JOGOS
========================================================= */

function renderGames() {

    const query =
        search.value
            .trim()
            .toLowerCase();

    gamesContainer.innerHTML = "";

    const filtered =
        allGames.filter(game =>
            game.name
                .toLowerCase()
                .includes(query)
        );

    if (filtered.length === 0) {

        status.textContent =
            query
                ? "Nenhum jogo encontrado."
                : "Nenhum jogo encontrado nesta pasta.";

        return;
    }

    status.textContent =
        `${filtered.length} jogo${filtered.length === 1 ? "" : "s"} encontrado${filtered.length === 1 ? "" : "s"}.`;


    filtered.forEach(game => {

        const card =
            document.createElement("a");

        card.className = "game";

        card.href =
            buildGameUrl(game);

        card.dataset.name =
            game.name.toLowerCase();

        card.innerHTML = `

            <div class="gameIcon">
                ${SYSTEMS[game.system].icon}
            </div>

            <div class="gameName">
                ${escapeHtml(game.name)}
            </div>

            <div class="gameType">
                ${SYSTEMS[game.system].name}
            </div>

        `;


        /*
         * IMPORTANTE:
         *
         * Não deixamos o navegador navegar para
         * outra página.
         *
         * Assim podemos solicitar fullscreen
         * durante o toque/clique do usuário.
         */

        card.addEventListener("click", event => {

            event.preventDefault();

            /*
             * O fullscreen é solicitado imediatamente
             * dentro do gesto do usuário.
             */
            requestFullscreen();


            /*
             * Atualiza a URL sem recarregar a página.
             */
            history.pushState(
                {
                    game: true,
                    slug: game.slug,
                    system: game.system
                },
                "",
                buildGamePath(game)
            );


            startEmulator(
                game.downloadUrl,
                game.system,
                game.name
            );

        });


        gamesContainer.appendChild(card);

    });

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   URL CURTA
========================================================= */

function buildGamePath(game) {

    return (
        "/" +
        game.system +
        "/" +
        encodeURIComponent(game.slug)
    );

}


/*
 * URL usada nos cards.
 *
 * Exemplo:
 *
 * /snes/super_mario_world
 *
 * /gb/pokemon_red
 */

function buildGameUrl(game) {

    return buildGamePath(game);

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function requestFullscreen() {

    /*
     * Se já estiver em fullscreen,
     * não fazemos nada.
     */

    if (
        document.fullscreenElement ||
        document.webkitFullscreenElement
    ) {
        return;
    }

    try {

        if (document.documentElement.requestFullscreen) {

            await document.documentElement.requestFullscreen();

        } else if (
            document.documentElement.webkitRequestFullscreen
        ) {

            document.documentElement.webkitRequestFullscreen();

        }

    } catch (error) {

        /*
         * Alguns navegadores, principalmente em
         * determinados celulares, podem bloquear
         * fullscreen.
         *
         * Nesse caso o emulador continua funcionando
         * normalmente.
         */

        console.log(
            "Fullscreen não permitido:",
            error
        );

    }

}


/* =========================================================
   INICIAR EMULADOR
========================================================= */

function startEmulator(
    rom,
    system,
    name
) {

    if (!rom) {

        alert(
            "Não foi possível encontrar a ROM."
        );

        return;

    }


    const config =
        SYSTEMS[system];


    /*
     * Mostra tela do emulador
     */

    library.style.display = "none";
    topbar.style.display = "none";

    emulatorScreen.classList.add("show");

    backButton.classList.add("show");

    loading.classList.add("show");

    loadingText.textContent =
        `Carregando ${name}...`;


    /*
     * CRT somente no SNES
     */

    if (system === "snes") {

        crt.classList.add("show");

    } else {

        crt.classList.remove("show");

    }


    /*
     * Remove instância anterior
     */

    const gameElement =
        document.getElementById("game");

    gameElement.innerHTML = "";


    /*
     * Configuração EmulatorJS
     */

    window.EJS_player =
        "#game";

    window.EJS_core =
        config.core;

    window.EJS_gameUrl =
        rom;

    window.EJS_gameName =
        name;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_biosUrl =
        "";

    window.EJS_mouse =
        false;

    window.EJS_multitap =
        false;

    /*
     * Não precisamos criar os controles
     * manualmente.
     *
     * O EmulatorJS cria o gamepad virtual
     * quando estiver disponível no dispositivo.
     */

    window.EJS_virtualGamepad =
        true;


    /*
     * Pequeno atraso para garantir que
     * o elemento #game esteja visível.
     */

    setTimeout(() => {

        const oldLoader =
            document.getElementById(
                "emulatorjs-loader"
            );

        if (oldLoader) {
            oldLoader.remove();
        }


        const script =
            document.createElement("script");

        script.id =
            "emulatorjs-loader";

        script.src =
            "https://cdn.emulatorjs.org/stable/data/loader.js";

        script.async = true;


        script.onload = () => {

            loading.classList.remove("show");

        };


        script.onerror = () => {

            loadingText.textContent =
                "Erro ao carregar o EmulatorJS.";

        };


        document.body.appendChild(script);

    }, 100);

}


/* =========================================================
   VOLTAR
========================================================= */

function backToLibrary() {

    /*
     * Para o emulador
     */

    emulatorStarted = false;


    /*
     * Limpa EmulatorJS
     */

    try {

        if (
            window.EJS_emulator &&
            typeof window.EJS_emulator.stop === "function"
        ) {

            window.EJS_emulator.stop();

        }

    } catch (error) {

        console.log(error);

    }


    /*
     * Remove o loader antigo
     */

    const loader =
        document.getElementById(
            "emulatorjs-loader"
        );

    if (loader) {
        loader.remove();
    }


    /*
     * Limpa o container
     */

    document.getElementById(
        "game"
    ).innerHTML = "";


    /*
     * Esconde emulador
     */

    emulatorScreen.classList.remove(
        "show"
    );

    backButton.classList.remove(
        "show"
    );

    crt.classList.remove(
        "show"
    );

    loading.classList.remove(
        "show"
    );


    /*
     * Mostra biblioteca
     */

    topbar.style.display = "";
    library.style.display = "";


    /*
     * Volta para a URL principal
     */

    history.pushState(
        {},
        "",
        window.location.pathname
    );


    /*
     * Sai do fullscreen
     */

    exitFullscreen();

}


/* =========================================================
   SAIR DO FULLSCREEN
========================================================= */

async function exitFullscreen() {

    try {

        if (document.fullscreenElement) {

            await document.exitFullscreen();

        } else if (
            document.webkitFullscreenElement
        ) {

            document.webkitExitFullscreen();

        }

    } catch (error) {

        console.log(error);

    }

}


/* =========================================================
   BOTÕES GAME BOY / SNES
========================================================= */

document
    .querySelectorAll(".systemButton")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const system =
                    button.dataset.system;

                currentSystem =
                    system;


                document
                    .querySelectorAll(
                        ".systemButton"
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                libraryTitle.textContent =
                    SYSTEMS[system].name;


                search.value = "";


                loadGames(system);

            }
        );

    });


/* =========================================================
   PESQUISA
========================================================= */

search.addEventListener(
    "input",
    () => {

        renderGames();

    }
);


/* =========================================================
   BOTÃO VOLTAR
========================================================= */

backButton.addEventListener(
    "click",
    () => {

        backToLibrary();

    }
);


/* =========================================================
   BOTÃO FÍSICO VOLTAR / HISTÓRICO
========================================================= */

window.addEventListener(
    "popstate",
    () => {

        const path =
            window.location.pathname;


        /*
         * Se estamos na página de um jogo,
         * podemos tentar abrir o jogo novamente.
         */

        if (
            path.startsWith("/gb/") ||
            path.startsWith("/snes/")
        ) {

            loadGameFromUrl();

        } else {

            backToLibrary();

        }

    }
);


/* =========================================================
   ABRIR JOGO DIRETAMENTE PELA URL
========================================================= */

async function loadGameFromUrl() {

    const path =
        window.location.pathname
            .replace(/^\/+/, "")
            .replace(/\/+$/, "");


    const parts =
        path.split("/");


    if (parts.length < 2) {

        return;

    }


    const system =
        parts[0].toLowerCase();


    const slug =
        decodeURIComponent(
            parts.slice(1).join("/")
        );


    if (!SYSTEMS[system]) {

        return;

    }


    /*
     * Busca automaticamente a pasta
     * correspondente.
     */

    try {

        const response =
            await fetch(
                GITHUB_API +
                SYSTEMS[system].folder
            );


        if (!response.ok) {
            return;
        }


        const files =
            await response.json();


        const file =
            files.find(item => {

                if (
                    item.type !== "file"
                ) {
                    return false;
                }


                const extension =
                    "." +
                    item.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                if (
                    !SYSTEMS[system]
                        .extensions
                        .includes(extension)
                ) {

                    return false;

                }


                return (
                    createSlug(item.name) ===
                    slug
                );

            });


        if (!file) {

            /*
             * Se não encontrou o jogo,
             * mostra biblioteca.
             */

            return;

        }


        /*
         * Atualiza botão ativo
         */

        currentSystem =
            system;


        document
            .querySelectorAll(
                ".systemButton"
            )
            .forEach(button => {

                button.classList.toggle(
                    "active",
                    button.dataset.system ===
                    system
                );

            });


        /*
         * Inicia jogo.
         *
         * OBS:
         * Se a pessoa abriu o link diretamente,
         * o navegador pode não permitir fullscreen,
         * porque não houve toque/clique imediatamente
         * antes do requestFullscreen().
         */

        startEmulator(
            file.download_url,
            system,
            normalizeGameName(file.name)
        );

    } catch (error) {

        console.error(
            "Erro abrindo jogo pela URL:",
            error
        );

    }

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function init() {

    /*
     * Primeiro verificamos se a URL já aponta
     * diretamente para um jogo.
     */

    const path =
        window.location.pathname
            .replace(/^\/+/, "")
            .replace(/\/+$/, "");


    const isGameUrl =
        path.startsWith("gb/") ||
        path.startsWith("snes/");


    if (isGameUrl) {

        /*
         * Não carregamos a biblioteca primeiro.
         */

        await loadGameFromUrl();

        return;

    }


    /*
     * Página normal.
     */

    loadGames("gb");

}


/* =========================================================
   COMEÇAR
========================================================= */

init();

</script>

</body>
</html>
