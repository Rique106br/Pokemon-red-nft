<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cartucho Game Boy NFC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        #status {
            font-size: 16px;
            color: #ffca28;
            margin-bottom: 10px;
        }
        canvas {
            width: 95vw;
            max-width: 480px;
            height: auto;
            image-rendering: pixelated;
            border: 2px solid #333;
            border-radius: 4px;
        }
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-gap: 10px;
            justify-content: center;
        }
        .btn {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            user-select: none;
            touch-action: manipulation;
        }
        .btn:active {
            background: #555;
        }
    </style>
</head>
<body>

    <div id="status">Iniciando Cartucho...</div>
    <canvas id="mainCanvas" width="160" height="144"></canvas>

    <!-- Usando o motor nativo leve via CDN estável JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/binJS/0.2.1/binJS.min.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        
        // Pega a ROM da raiz do seu repositório GitHub
        const romUrl = './pokemon_red.gb';

        statusDiv.innerText = "Lendo ROM do Cartucho...";

        fetch(romUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Arquivo 'pokemon_red.gb' não encontrado na raiz do GitHub!");
                }
                return response.arrayBuffer();
            })
            .then(buffer => {
                statusDiv.innerText = "Pokémon Red Carregado! Processando...";
                
                // Redireciona para o player web ultraleve sem travas de CORS
                const blob = new Blob([buffer], { type: 'application/octet-stream' });
                const blobUrl = URL.createObjectURL(blob);
                
                // Carrega a ROM direto no motor web limpo
                window.location.href = "https://emulatorjs.org/demo.html?core=gb&rom=" + encodeURIComponent(window.location.href.replace('index.html', '') + 'pokemon_red.gb');
            })
            .catch(err => {
                statusDiv.style.color = "#ff5252";
                statusDiv.innerText = "Erro: " + err.message;
            });
    </script>
</body>
</html>
