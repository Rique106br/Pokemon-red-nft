<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Retro Games</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#080808;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#111;
    border-bottom:1px solid #292929;
    padding:14px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    margin-bottom:12px;
}

.search{
    width:100%;
    padding:13px 15px;
    border-radius:10px;
    border:1px solid #333;
    background:#1b1b1b;
    color:white;
    outline:none;
    font-size:16px;
}

/* MENU */

.menu{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.menu button{
    flex:1;
    padding:11px;
    border:0;
    border-radius:9px;
    background:#242424;
    color:#ddd;
    font-weight:bold;
    cursor:pointer;
}

.menu button.active{
    background:#fff;
    color:#000;
}

/* CONTEÚDO */

main{
    padding:16px;
    max-width:1200px;
    margin:auto;
}

.status{
    color:#aaa;
    margin:10px 0 18px;
    font-size:14px;
}

/* GRID */

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:14px;
}

/* CARD */

.game{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    overflow:hidden;
    transition:.15s;
}

.game:hover{
    transform:translateY(-2px);
}

.game-info{
    padding:14px;
}

.game-title{
    font-weight:bold;
    font-size:16px;
    margin-bottom:5px;
    word-break:break-word;
}

.game-system{
    font-size:12px;
    color:#888;
    margin-bottom:12px;
}

.play{
    display:block;
    width:100%;
    padding:10px;
    border-radius:8px;
    background:#fff;
    color:#000;
    border:0;
    text-align:center;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:8px;
}

.copy{
    display:block;
    width:100%;
    padding:9px;
    border-radius:8px;
    background:#222;
    color:#fff;
    border:1px solid #333;
    cursor:pointer;
}

/* VAZIO */

.empty{
    text-align:center;
    color:#777;
    padding:50px 20px;
}

/* MOBILE */

@media(max-width:600px){

    .games{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    main{
        padding:10px;
    }

    .game-info{
        padding:11px;
    }

    .game-title{
        font-size:14px;
    }

    .play,
    .copy{
        font-size:13px;
        padding:9px 5px;
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        🎮 Retro Games
    </div>

    <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 Procurar jogo..."
    >

    <div class="menu">

        <button
            id="btnGB"
            class="active"
            onclick="changeSystem('gb')">
            🎮 Game Boy
        </button>

        <button
            id="btnSNES"
            onclick="changeSystem('snes')">
            🕹️ SNES
        </button>

    </div>

</header>


<main>

    <div id="status" class="status">
        Procurando jogos...
    </div>

    <div id="games" class="games"></div>

</main>


<script>

/* ==========================================
   CONFIGURAÇÃO
========================================== */

const GITHUB_USER = "Rique106br";
const GITHUB_REPO = "Pokemon-red-nft";
const GITHUB_BRANCH = "main";

const SITE_BASE =
    "https://rique106br.github.io/" +
    GITHUB_REPO +
    "/";


/* ==========================================
   EXTENSÕES
========================================== */

const EXTENSIONS = {

    gb: [
        ".gb",
        ".gbc"
    ],

    snes: [
        ".sfc",
        ".smc",
        ".fig",
        ".swc",
        ".bsx"
    ]

};


/* ==========================================
   ESTADO
========================================== */

let currentSystem = "gb";

let allGames = {
    gb: [],
    snes: []
};


/* ==========================================
   ELEMENTOS
========================================== */

const gamesElement =
    document.getElementById("games");

const statusElement =
    document.getElementById("status");

const searchElement =
    document.getElementById("search");


/* ==========================================
   SLUG
========================================== */

function createSlug(filename){

    return filename
        .replace(/\.[^/.]+$/, "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");

}


/* ==========================================
   NOME BONITO
========================================== */

function cleanName(filename){

    return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/[_-]+/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* ==========================================
   API DO GITHUB
========================================== */

async function loadGames(system){

    const folder = system;

    statusElement.textContent =
        "Procurando jogos em /" + folder + "...";

    try{

        const api =
            `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${folder}?ref=${GITHUB_BRANCH}`;

        const response =
            await fetch(api);

        if(!response.ok){

            throw new Error(
                "GitHub retornou " +
                response.status
            );

        }

        const files =
            await response.json();

        const games =
            files
            .filter(file => file.type === "file")
            .filter(file => {

                const name =
                    file.name.toLowerCase();

                return EXTENSIONS[system]
                    .some(ext => name.endsWith(ext));

            })
            .map(file => {

                return {

                    filename:file.name,

                    name:cleanName(file.name),

                    slug:createSlug(file.name),

                    path:file.path,

                    url:file.download_url,

                    system:system

                };

            })
            .sort((a,b) =>
                a.name.localeCompare(
                    b.name,
                    "pt-BR"
                )
            );

        allGames[system] = games;

        renderGames();

    }catch(error){

        console.error(error);

        statusElement.textContent =
            "Erro ao encontrar os jogos.";

        gamesElement.innerHTML = `
            <div class="empty">
                ❌ Não consegui acessar a pasta
                <b>/${system}</b>.<br><br>

                Verifique se a pasta existe no
                repositório e se as ROMs estão
                dentro dela.
            </div>
        `;

    }

}


/* ==========================================
   GERAR URL DO PLAYER
========================================== */

function getPlayerURL(game){

    return SITE_BASE +
        "player.html?game=" +
        encodeURIComponent(
            game.path
        );

}


/* ==========================================
   COPIAR LINK
========================================== */

async function copyGameLink(game,button){

    const url =
        getPlayerURL(game);

    try{

        await navigator.clipboard.writeText(url);

        const oldText =
            button.textContent;

        button.textContent =
            "✅ Link copiado!";

        setTimeout(() => {

            button.textContent =
                oldText;

        },1500);

    }catch(error){

        /* Fallback para navegadores antigos */

        const input =
            document.createElement("input");

        input.value = url;

        document.body.appendChild(input);

        input.select();

        document.execCommand("copy");

        input.remove();

        button.textContent =
            "✅ Link copiado!";

        setTimeout(() => {

            button.textContent =
                "🔗 Copiar link";

        },1500);

    }

}


/* ==========================================
   RENDERIZAR
========================================== */

function renderGames(){

    const search =
        searchElement.value
        .toLowerCase()
        .trim();

    const games =
        allGames[currentSystem]
        .filter(game =>

            game.name
                .toLowerCase()
                .includes(search)

        );

    gamesElement.innerHTML = "";

    if(games.length === 0){

        gamesElement.innerHTML = `
            <div class="empty">
                🎮 Nenhum jogo encontrado.
            </div>
        `;

        statusElement.textContent =
            "0 jogos";

        return;

    }


    statusElement.textContent =
        games.length +
        (games.length === 1
            ? " jogo encontrado"
            : " jogos encontrados");


    games.forEach(game => {

        const card =
            document.createElement("div");

        card.className =
            "game";


        const info =
            document.createElement("div");

        info.className =
            "game-info";


        const title =
            document.createElement("div");

        title.className =
            "game-title";

        title.textContent =
            game.name;


        const system =
            document.createElement("div");

        system.className =
            "game-system";

        system.textContent =
            currentSystem === "gb"
                ? "GAME BOY"
                : "SUPER NINTENDO";


        /* JOGAR */

        const play =
            document.createElement("a");

        play.className =
            "play";

        play.textContent =
            "▶ Jogar";


        play.href =
            getPlayerURL(game);


        /* COPIAR */

        const copy =
            document.createElement("button");

        copy.className =
            "copy";

        copy.textContent =
            "🔗 Copiar link";


        copy.onclick = () => {

            copyGameLink(
                game,
                copy
            );

        };


        info.appendChild(title);

        info.appendChild(system);

        info.appendChild(play);

        info.appendChild(copy);

        card.appendChild(info);

        gamesElement.appendChild(card);

    });

}


/* ==========================================
   TROCAR SISTEMA
========================================== */

function changeSystem(system){

    currentSystem =
        system;


    document
        .getElementById("btnGB")
        .classList.toggle(
            "active",
            system === "gb"
        );


    document
        .getElementById("btnSNES")
        .classList.toggle(
            "active",
            system === "snes"
        );


    searchElement.value = "";

    renderGames();

    if(allGames[system].length === 0){

        loadGames(system);

    }

}


/* ==========================================
   PESQUISA
========================================== */

searchElement.addEventListener(
    "input",
    renderGames
);


/* ==========================================
   INICIAR
========================================== */

loadGames("gb");

</script>

</body>
</html>
