<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy NFC Emulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script type="text/javascript">
        // Pega o nome da ROM passado na URL (?rom=pokemon_red.gb) ou usa pokemon_red.gb por padrão
        const urlParams = new URLSearchParams(window.location.search);
        const romName = urlParams.get('rom') || 'pokemon_red.gb';

        EJS_player = "#game";
        EJS_core = "gb";
        EJS_gameName = "Pokémon Red";
        EJS_color = "#e52521";
        EJS_startOnLoaded = true;
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        EJS_gameUrl = romName; // Pega o arquivo direto da raiz do seu GitHub Pages
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
