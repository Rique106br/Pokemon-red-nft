<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>RETRO GAMES</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #080808;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   TOPO
===================================================== */

#topbar {

    position: sticky;

    top: 0;

    width: 100%;

    min-height: 58px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 8px 14px;

    background: #111;

    border-bottom: 1px solid #333;

    z-index: 10000;

}


.logo {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 3px;

}


.menu {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;

    justify-content: flex-end;

}


.menu a {

    display: block;

    padding: 9px 12px;

    color: white;

    background: #222;

    border: 1px solid #555;

    border-radius: 8px;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;

}


.menu a:hover {

    background: #333;

}


.menu a.active {

    background: white;

    color: black;

}


/* =====================================================
   BIBLIOTECA
===================================================== */

#library {

    width: 100%;

    max-width: 1000px;

    margin: auto;

    padding: 20px;

}


.title {

    font-size: 24px;

    font-weight: 900;

    margin-bottom: 15px;

}


#search {

    width: 100%;

    height: 48px;

    padding: 0 15px;

    margin-bottom: 22px;

    background: #181818;

    color: white;

    border: 1px solid #444;

    border-radius: 10px;

    outline: none;

    font-size: 16px;

}


#search:focus {

    border-color: #fff;

}


/* =====================================================
   SISTEMAS
===================================================== */

.system {

    margin-bottom: 30px;

}


.system-title {

    font-size: 19px;

    font-weight: bold;

    padding-bottom: 9px;

    margin-bottom: 12px;

    border-bottom: 1px solid #333;

}


.games {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(190px, 1fr));

    gap: 10px;

}


.game {

    display: block;

    padding: 15px;

    min-height: 75px;

    background: #191919;

    color: white;

    border: 1px solid #333;

    border-radius: 10px;

    text-decoration: none;

    transition:
        transform .15s,
        background .15s;

}


.game:hover {

    background: #292929;

    transform: translateY(-2px);

}


.game-name {

    font-size: 15px;

    font-weight: bold;

    word-break: break-word;

}


.game-file {

    margin-top: 7px;

    color: #888;

    font-size: 11px;

    word-break: break-all;

}


/* =====================================================
   CARREGANDO
===================================================== */

#loading {

    padding: 35px 10px;

    text-align: center;

    color: #aaa;

}


#error {

    display: none;

    margin: 15px 0;

    padding: 15px;

    background: #241111;

    border: 1px solid #713333;

    border-radius: 10px;

    color: #ff7777;

}


/* =====================================================
   EMULADOR
===================================================== */

#emulator {

    position: fixed;

    inset: 0;

    display: none;

    background: #000;

    z-index: 50000;

}


#game {

    width: 100%;

    height: 100%;

    background: #000;

}


/* =====================================================
   BOTÃO VOLTAR
===================================================== */

#back {

    position: fixed;

    top: 10px;

    left: 10px;

    z-index: 100000;

    display: none;

    padding: 10px 14px;

    background:
        rgba(0, 0, 0, .8);

    color: white;

    border: 1px solid #555;

    border-radius: 8px;

    font-size: 14px;

    font-weight: bold;

}


/* =====================================================
   CRT
===================================================== */

#crt {

    position: fixed;

    inset: 0;

    z-index: 90000;

    pointer-events: none;

    display: none;

    background:

        repeating-linear-gradient(

            to bottom,

            rgba(0,0,0,0) 0px,

            rgba(0,0,0,0) 2px,

            rgba(0,0,0,.10) 3px

        );

    box-shadow:

        inset 0 0 100px
        rgba(0,0,0,.45);

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    #topbar {

        min-height: 50px;

        padding: 7px 9px;

    }


    .logo {

        font-size: 16px;

        letter-spacing: 2px;

    }


    .menu {

        gap: 5px;

    }


    .menu a {

        padding: 7px 8px;

        font-size: 11px;

    }


    #library {

        padding: 14px;

    }


    .games {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .game {

        padding: 13px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     MENU
===================================================== -->

<header id="topbar">

    <div class="logo">
        RETRO
    </div>


    <nav class="menu">

        <a href="#gb">
            GAME BOY
        </a>

        <a href="#snes">
            SNES
        </a>

    </nav>

</header>



<!-- =====================================================
     BIBLIOTECA
===================================================== -->

<main id="library">

    <div class="title">
        Biblioteca
    </div>


    <input
        id="search"
        type="search"
        placeholder="🔎 Procurar jogo..."
        autocomplete="off"
    >


    <div id="loading">
        🔎 Procurando jogos...
    </div>


    <div id="error"></div>



    <!-- GAME BOY -->

    <section
        id="gb"
        class="system"
        style="display:none"
    >

        <div class="system-title">
            🎮 Game Boy
        </div>


        <div
            id="gbGames"
            class="games"
        ></div>

    </section>



    <!-- SNES -->

    <section
        id="snes"
        class="system"
        style="display:none"
    >

        <div class="system-title">
            🕹️ Super Nintendo
        </div>


        <div
            id="snesGames"
            class="games"
        ></div>

    </section>

</main>



<!-- =====================================================
     EMULADOR
===================================================== -->

<div id="emulator">

    <button
        id="back"
        onclick="closeGame()"
    >
        ← Voltar
    </button>


    <div id="game"></div>

</div>


<div id="crt"></div>



<script>

/* =====================================================
   CONFIGURAÇÃO DO GITHUB
===================================================== */

/*
    MUDE SOMENTE SE SEU REPOSITÓRIO
    NÃO FOR ESTE.

    Seu exemplo:

    https://rique106br.github.io/Pokemon/

    usuário:
    rique106br

    repositório:
    Pokemon
*/

const GITHUB_USER =
    "Rique106br";

const GITHUB_REPO =
    "Pokemon-red-nft";


/* =====================================================
   EXTENSÕES
===================================================== */

const extensions = {

    gb: [

        ".gb",

        ".gbc"

    ],


    snes: [

        ".sfc",

        ".smc",

        ".fig",

        ".swc",

        ".bsx"

    ]

};


/* =====================================================
   LISTA DE JOGOS
===================================================== */

let allGames = [];


/* =====================================================
   ACESSAR PASTA DO GITHUB
===================================================== */

async function getFolder(folder) {

    const apiUrl =

        "https://api.github.com/repos/" +

        GITHUB_USER +

        "/" +

        GITHUB_REPO +

        "/contents/" +

        folder;


    const response =
        await fetch(apiUrl);


    if (!response.ok) {

        throw new Error(

            "Não consegui acessar a pasta " +

            folder +

            ". HTTP " +

            response.status

        );

    }


    const files =
        await response.json();


    if (!Array.isArray(files)) {

        throw new Error(
            "Resposta inválida do GitHub."
        );

    }


    return files.filter(
        file => file.type === "file"
    );

}


/* =====================================================
   VERIFICAR EXTENSÃO
===================================================== */

function isValid(file, system) {

    const filename =
        file.name.toLowerCase();


    return extensions[system]
        .some(
            extension =>
                filename.endsWith(extension)
        );

}


/* =====================================================
   NOME DO JOGO
===================================================== */

function cleanName(filename) {

    return filename

        .replace(
            /\.(gb|gbc|sfc|smc|fig|swc|bsx)$/i,
            ""
        )

        .replace(
            /[_-]+/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =====================================================
   CRIAR CARD
===================================================== */

function createGame(file, system) {

    const card =
        document.createElement("a");


    card.className =
        "game";


    /*
       IMPORTANTE:

       O GitHub fornece uma URL direta
       para o arquivo.

       Isso funciona inclusive para:

       Super Mario World.smc
    */

    const romUrl =
        file.download_url;


    card.href =

        "?play=" +

        encodeURIComponent(
            romUrl
        ) +

        "&core=" +

        encodeURIComponent(
            system
        ) +

        "&name=" +

        encodeURIComponent(
            cleanName(file.name)
        );


    card.innerHTML =

        '<div class="game-name">' +

        escapeHtml(
            cleanName(file.name)
        ) +

        '</div>' +

        '<div class="game-file">' +

        escapeHtml(
            file.name
        ) +

        '</div>';


    return card;

}


/* =====================================================
   PROTEÇÃO HTML
===================================================== */

function escapeHtml(text) {

    return text

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MOSTRAR JOGOS
===================================================== */

function renderGames() {

    const gbBox =
        document.getElementById(
            "gbGames"
        );


    const snesBox =
        document.getElementById(
            "snesGames"
        );


    gbBox.innerHTML = "";

    snesBox.innerHTML = "";


    let gbCount = 0;

    let snesCount = 0;


    allGames.forEach(
        game => {


            const card =
                createGame(
                    game.file,
                    game.system
                );


            if (
                game.system === "gb"
            ) {

                gbBox.appendChild(
                    card
                );

                gbCount++;

            }


            if (
                game.system === "snes"
            ) {

                snesBox.appendChild(
                    card
                );

                snesCount++;

            }

        }
    );


    document.getElementById("gb")
        .style.display =
            gbCount > 0
                ? "block"
                : "none";


    document.getElementById("snes")
        .style.display =
            snesCount > 0
                ? "block"
                : "none";

}


/* =====================================================
   BUSCA
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {

            const query =
                this.value
                    .toLowerCase()
                    .trim();


            document
                .querySelectorAll(".game")
                .forEach(
                    card => {

                        const text =
                            card.innerText
                                .toLowerCase();


                        card.style.display =

                            text.includes(
                                query
                            )

                                ? "block"

                                : "none";

                    }
                );

        }
    );


/* =====================================================
   PROCURAR ROMS AUTOMATICAMENTE
===================================================== */

async function scanGames() {

    try {

        document.getElementById(
            "loading"
        ).style.display =
            "block";


        /*
           Limpa lista anterior.
        */

        allGames = [];


        /*
           Procura as duas pastas.
        */

        const results =
            await Promise.allSettled([

                getFolder("gb"),

                getFolder("snes")

            ]);


        /*
           GAME BOY
        */

        if (
            results[0].status ===
            "fulfilled"
        ) {

            results[0]
                .value
                .filter(
                    file =>
                        isValid(
                            file,
                            "gb"
                        )
                )
                .forEach(
                    file => {

                        allGames.push({

                            system: "gb",

                            file: file

                        });

                    }
                );

        }


        /*
           SNES
        */

        if (
            results[1].status ===
            "fulfilled"
        ) {

            results[1]
                .value
                .filter(
                    file =>
                        isValid(
                            file,
                            "snes"
                        )
                )
                .forEach(
                    file => {

                        allGames.push({

                            system: "snes",

                            file: file

                        });

                    }
                );

        }


        /*
           Ordenar alfabeticamente.
        */

        allGames.sort(
            (a, b) =>
                a.file.name
                    .localeCompare(
                        b.file.name
                    )
        );


        renderGames();


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        /*
           Se nenhuma pasta existir.
        */

        if (
            allGames.length === 0
        ) {

            showError(

                "Nenhum ROM encontrado.<br><br>" +

                "Verifique se existem as pastas:" +

                "<br><br>" +

                "<b>gb/</b>" +

                "<br>" +

                "<b>snes/</b>"

            );

        }

    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        showError(
            error.message
        );

    }

}


/* =====================================================
   MOSTRAR ERRO
===================================================== */

function showError(message) {

    const error =
        document.getElementById(
            "error"
        );


    error.innerHTML =
        "❌ " + message;


    error.style.display =
        "block";

}


/* =====================================================
   INICIAR EMULATORJS
===================================================== */

function startEmulator() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const rom =
        params.get("play");


    const core =
        params.get("core");


    const name =
        params.get("name") ||
        "Retro Game";


    /*
       Se não existe ROM na URL,
       mostramos a biblioteca.
    */

    if (!rom) {

        scanGames();

        return;

    }


    /*
       Verifica o core.
    */

    if (
        core !== "gb" &&
        core !== "snes"
    ) {

        window.location.href =
            window.location.pathname;

        return;

    }


    /*
       Esconder biblioteca.
    */

    document.getElementById(
        "library"
    ).style.display =
        "none";


    document.getElementById(
        "topbar"
    ).style.display =
        "none";


    /*
       Mostrar emulador.
    */

    document.getElementById(
        "emulator"
    ).style.display =
        "block";


    document.getElementById(
        "back"
    ).style.display =
        "block";


    /*
       CRT somente no SNES.

       Se quiser tirar completamente,
       pode colocar false.
    */

    if (core === "snes") {

        document.getElementById(
            "crt"
        ).style.display =
            "block";

    }


    /*
       Limpar jogador.
    */

    document.getElementById(
        "game"
    ).innerHTML =
        "";


    /* =================================================
       EMULATORJS
    ================================================= */


    /*
       Elemento do jogador.
    */

    window.EJS_player =
        "#game";


    /*
       CORE

       Game Boy:
       gb

       Super Nintendo:
       snes
    */

    window.EJS_core =
        core;


    /*
       URL DIRETA DO ROM
    */

    window.EJS_gameUrl =
        rom;


    /*
       Nome.
    */

    window.EJS_gameName =
        name;


    /*
       Dados do EmulatorJS.
    */

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";


    /*
       Começar automaticamente.
    */

    window.EJS_startOnLoaded =
        true;


    /*
       BIOS vazia.

       GB e SNES não precisam de BIOS
       para os jogos comuns.
    */

    window.EJS_biosUrl =
        "";


    /*
       Idioma.
    */

    window.EJS_language =
        7;


    /*
       Cor da interface.
    */

    window.EJS_color =
        "#ffffff";


    /*
       Mouse desligado.
    */

    window.EJS_mouse =
        false;


    /*
       Multitap desligado.
    */

    window.EJS_multitap =
        false;


    /*
       NÃO fazemos:

       EJS_VirtualGamepadSettings = [];

       porque queremos que o
       controle virtual apareça
       no celular.
    */


    /* =================================================
       CARREGAR LOADER
    ================================================= */


    const script =
        document.createElement(
            "script"
        );


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.async =
        true;


    script.onload =
        function () {

            console.log(
                "EmulatorJS carregado."
            );

        };


    script.onerror =
        function () {

            showError(
                "Não foi possível carregar o EmulatorJS."
            );

        };


    document.body
        .appendChild(
            script
        );

}


/* =====================================================
   VOLTAR
===================================================== */

function closeGame() {

    /*
       Volta para a biblioteca.
    */

    window.location.href =
        window.location.pathname;

}


/* =====================================================
   INICIAR
===================================================== */

startEmulator();

</script>

</body>

</html>
