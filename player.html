<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Retro Player</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000;
}


/* =========================================================
   EMULADOR
========================================================= */

#game {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    min-width: 100vw;
    min-height: 100vh;

    background: #000;

    overflow: hidden;

}


/* =========================================================
   BARRA SUPERIOR
========================================================= */

#topbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 48px;

    z-index: 999999;

    display: flex;

    align-items: center;

    padding:

        max(5px, env(safe-area-inset-top))

        10px

        5px

        10px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.90),
            rgba(0,0,0,.55)
        );

    transition:
        opacity .3s ease;

}

#backButton {

    border: 1px solid #444;

    background: #181818;

    color: #fff;

    border-radius: 8px;

    padding: 7px 12px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

}

#backButton:active {

    transform: scale(.95);

}

#gameTitle {

    flex: 1;

    margin-left: 10px;

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 14px;

    font-weight: bold;

}


/* =========================================================
   TELA DE INÍCIO
========================================================= */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 1000000;

    width: 100vw;
    height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px;

    background:

        radial-gradient(
            circle at center,
            #222 0%,
            #0b0b0b 45%,
            #000 100%
        );

}

#startIcon {

    font-size: 60px;

    margin-bottom: 10px;

}

#startTitle {

    max-width: 90vw;

    font-size: 28px;

    font-weight: bold;

    margin-bottom: 8px;

    word-break: break-word;

}

#startSystem {

    color: #aaa;

    font-size: 14px;

    margin-bottom: 24px;

}

#startButton {

    border: 0;

    border-radius: 12px;

    padding: 15px 30px;

    background: #fff;

    color: #000;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 25px rgba(255,255,255,.15);

}

#startButton:active {

    transform: scale(.96);

}

#loading {

    display: none;

    margin-top: 15px;

    color: #aaa;

    font-size: 13px;

}


/* =========================================================
   MENSAGEM DE ERRO
========================================================= */

#errorScreen {

    position: fixed;

    inset: 0;

    z-index: 1000001;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px;

    background: #000;

}

#errorScreen h2 {

    margin: 0 0 10px;

}

#errorScreen p {

    color: #aaa;

    max-width: 450px;

    line-height: 1.5;

}

#errorBack {

    margin-top: 15px;

    border: 0;

    border-radius: 9px;

    padding: 12px 20px;

    background: #fff;

    color: #000;

    font-weight: bold;

}


/* =========================================================
   AVISO RETRATO
========================================================= */

#portraitWarning {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 999998;

    background: rgba(0,0,0,.96);

    justify-content: center;

    align-items: center;

    flex-direction: column;

    text-align: center;

    padding: 25px;

}

#portraitWarning .rotateIcon {

    font-size: 55px;

    margin-bottom: 15px;

}

#portraitWarning strong {

    font-size: 20px;

}

#portraitWarning span {

    margin-top: 8px;

    color: #aaa;

}


/* =========================================================
   HORIZONTAL
========================================================= */

@media screen and (orientation: landscape) {

    #topbar {

        height: 45px;

    }

    #game {

        width: 100vw;
        height: 100vh;

    }

}


/* =========================================================
   RETRATO
========================================================= */

@media screen and (orientation: portrait)
       and (max-width: 800px) {

    #portraitWarning {

        display: flex;

    }

    #topbar {

        display: none;

    }

}


/* =========================================================
   CELULAR HORIZONTAL
========================================================= */

@media screen
       and (orientation: landscape)
       and (max-height: 600px) {

    #topbar {

        height: 38px;

        padding:
            3px
            8px;

    }

    #backButton {

        padding: 5px 9px;

        font-size: 12px;

    }

    #gameTitle {

        font-size: 12px;

    }

    #startIcon {

        font-size: 42px;

    }

    #startTitle {

        font-size: 22px;

    }

    #startSystem {

        margin-bottom: 14px;

    }

    #startButton {

        padding: 11px 24px;

        font-size: 15px;

    }

}


/* =========================================================
   TELA MUITO BAIXA
========================================================= */

@media screen
       and (orientation: landscape)
       and (max-height: 400px) {

    #startIcon {

        display: none;

    }

    #startTitle {

        font-size: 19px;

        margin-bottom: 5px;

    }

    #startSystem {

        margin-bottom: 10px;

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

:fullscreen {

    width: 100vw !important;
    height: 100vh !important;

    background: #000 !important;

}

:-webkit-full-screen {

    width: 100vw !important;
    height: 100vh !important;

    background: #000 !important;

}

</style>

</head>


<body>


<!-- ========================================================
     EMULADOR
========================================================= -->

<div id="game"></div>


<!-- ========================================================
     BARRA
========================================================= -->

<div id="topbar">

    <button
        id="backButton"
        onclick="goBack()">

        ← Voltar

    </button>

    <div id="gameTitle">
        Retro Player
    </div>

</div>


<!-- ========================================================
     TELA DE INÍCIO
========================================================= -->

<div id="startScreen">

    <div id="startIcon">
        🎮
    </div>

    <div id="startTitle">
        Retro Player
    </div>

    <div id="startSystem">
        Carregando...
    </div>

    <button
        id="startButton"
        onclick="startGame()">

        ▶ INICIAR JOGO

    </button>

    <div id="loading">

        Carregando EmulatorJS...

    </div>

</div>


<!-- ========================================================
     ERRO
========================================================= -->

<div id="errorScreen">

    <h2>
        ❌ Não foi possível abrir o jogo
    </h2>

    <p id="errorText">
        Verifique o endereço da ROM.
    </p>

    <button
        id="errorBack"
        onclick="goBack()">

        ← Voltar para os jogos

    </button>

</div>


<!-- ========================================================
     AVISO RETRATO
========================================================= -->

<div id="portraitWarning">

    <div class="rotateIcon">
        📱↻
    </div>

    <strong>
        Vire o celular
    </strong>

    <span>
        Coloque o celular na horizontal
        para jogar.
    </span>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const GITHUB_USER =
    "Rique106br";

const GITHUB_REPO =
    "Pokemon-red-nft";

const GITHUB_BRANCH =
    "main";


/*
   Versão estável do EmulatorJS.
*/

const EJS_DATA =
    "https://cdn.emulatorjs.org/stable/data/";


/* =========================================================
   ELEMENTOS
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startTitle =
    document.getElementById(
        "startTitle"
    );

const startSystem =
    document.getElementById(
        "startSystem"
    );

const loading =
    document.getElementById(
        "loading"
    );

const gameTitle =
    document.getElementById(
        "gameTitle"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorText =
    document.getElementById(
        "errorText"
    );


/* =========================================================
   PEGAR PARÂMETRO DA URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const gamePath =
    params.get("game");


/* =========================================================
   NORMALIZAR CAMINHO
========================================================= */

function normalizePath(path) {

    if (!path) {
        return "";
    }

    return decodeURIComponent(path)
        .replace(/^\/+/, "")
        .replace(/\\/g, "/");

}


/* =========================================================
   CAMINHO DA ROM
========================================================= */

const normalizedGamePath =
    normalizePath(gamePath);


/* =========================================================
   PEGAR NOME DO JOGO
========================================================= */

function getGameName(path) {

    if (!path) {
        return "Retro Player";
    }

    const parts =
        path.split("/");

    let filename =
        parts[parts.length - 1];

    filename =
        filename.replace(
            /\.[^/.]+$/,
            ""
        );

    return filename
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


/* =========================================================
   PEGAR EXTENSÃO
========================================================= */

function getExtension(path) {

    const match =
        path.match(
            /\.([^.\/]+)$/
        );

    if (!match) {
        return "";
    }

    return match[1]
        .toLowerCase();

}


/* =========================================================
   DESCOBRIR SISTEMA
========================================================= */

function getSystem(path) {

    const lower =
        path.toLowerCase();


    /*
       GAME BOY
    */

    if (
        lower.endsWith(".gb") ||
        lower.endsWith(".gbc") ||
        lower.startsWith("gb/")
    ) {

        return "gb";

    }


    /*
       SNES
    */

    if (
        lower.endsWith(".sfc") ||
        lower.endsWith(".smc") ||
        lower.endsWith(".fig") ||
        lower.endsWith(".swc") ||
        lower.endsWith(".bsx") ||
        lower.startsWith("snes/")
    ) {

        return "snes";

    }


    return null;

}


/* =========================================================
   DADOS DO JOGO
========================================================= */

const gameName =
    getGameName(
        normalizedGamePath
    );

const system =
    getSystem(
        normalizedGamePath
    );


/* =========================================================
   MOSTRAR NOME
========================================================= */

startTitle.textContent =
    gameName;

gameTitle.textContent =
    gameName;


/* =========================================================
   MOSTRAR SISTEMA
========================================================= */

if (system === "gb") {

    startSystem.textContent =
        "🎮 Game Boy";

}
else if (system === "snes") {

    startSystem.textContent =
        "🕹️ Super Nintendo";

}
else {

    startSystem.textContent =
        "❓ Sistema não reconhecido";

}


/* =========================================================
   VALIDAR URL
========================================================= */

if (
    !normalizedGamePath ||
    !system
) {

    startScreen.style.display =
        "none";

    errorScreen.style.display =
        "flex";

    errorText.textContent =
        "A URL precisa conter um jogo válido. " +
        "Exemplo: player.html?game=gb/pokemon_red.gb";

}


/* =========================================================
   GERAR URL DA ROM
========================================================= */

function getRomURL(path) {

    /*
       encodeURIComponent não é usado no caminho
       inteiro porque precisamos manter as barras.
    */

    const encodedPath =
        path
            .split("/")
            .map(part =>
                encodeURIComponent(part)
            )
            .join("/");


    return (
        "https://raw.githubusercontent.com/" +
        GITHUB_USER +
        "/" +
        GITHUB_REPO +
        "/" +
        GITHUB_BRANCH +
        "/" +
        encodedPath
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function enterFullscreen() {

    try {

        if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ) {

            await document.documentElement
                .requestFullscreen();

        }

    }
    catch (error) {

        console.log(
            "Fullscreen bloqueado:",
            error
        );

    }


    /*
       Alguns navegadores Android permitem
       travar a orientação depois do fullscreen.
    */

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    }
    catch (error) {

        console.log(
            "Orientação automática não disponível:",
            error
        );

    }

}


/* =========================================================
   TENTAR ORIENTAÇÃO HORIZONTAL
========================================================= */

async function forceLandscape() {

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

            return true;

        }

    }
    catch (error) {

        console.log(
            "Não foi possível bloquear landscape:",
            error
        );

    }

    return false;

}


/* =========================================================
   CRIAR ID DO JOGO
========================================================= */

function createGameID(path) {

    let hash = 0;


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        hash =
            (
                (
                    hash << 5
                )
                -
                hash
                +
                path.charCodeAt(i)
            ) | 0;

    }


    return Math.abs(hash);

}


/* =========================================================
   INICIAR EMULADOR
========================================================= */

async function startGame() {

    if (
        !normalizedGamePath ||
        !system
    ) {

        return;

    }


    /*
       O fullscreen precisa ser chamado
       durante o toque do usuário.
    */

    await enterFullscreen();


    /*
       Tenta travar em horizontal.
    */

    await forceLandscape();


    /*
       Atualiza interface.
    */

    startButton.disabled =
        true;

    startButton.textContent =
        "⏳ CARREGANDO...";

    loading.style.display =
        "block";


    /*
       Configuração principal
       do EmulatorJS.
    */

    window.EJS_player =
        "#game";


    window.EJS_core =
        system;


    window.EJS_gameUrl =
        getRomURL(
            normalizedGamePath
        );


    window.EJS_gameName =
        gameName;


    window.EJS_gameID =
        createGameID(
            normalizedGamePath
        );


    window.EJS_pathtodata =
        EJS_DATA;


    /*
       Inicia automaticamente
       depois que o loader carregar.
    */

    window.EJS_startOnLoaded =
        true;


    /*
       O fullscreen já foi solicitado
       pelo botão do usuário.
    */

    window.EJS_fullscreenOnLoaded =
        false;


    /*
       Esquema dos controles virtuais.
    */

    window.EJS_controlScheme =
        system;


    /*
       Idioma.
    */

    window.EJS_language =
        "pt-BR";


    /*
       Sem BIOS.
    */

    window.EJS_biosUrl =
        "";


    /*
       Sem threads.
       GitHub Pages não permite configurar
       COOP/COEP para SharedArrayBuffer.
    */

    window.EJS_threads =
        false;


    /*
       Volume inicial.
    */

    window.EJS_volume =
        0.8;


    /*
       Não usar mouse.
    */

    window.EJS_mouse =
        false;


    /*
       Multitap desligado.
    */

    window.EJS_multitap =
        false;


    /*
       Cor da interface.
    */

    window.EJS_color =
        "#ffffff";


    /*
       Carregar o EmulatorJS.
    */

    const existing =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (existing) {

        existing.remove();

    }


    const script =
        document.createElement(
            "script"
        );


    script.id =
        "emulatorjs-loader";


    script.src =
        EJS_DATA +
        "loader.js";


    script.async =
        true;


    script.onload =
        function () {

            console.log(
                "EmulatorJS carregado."
            );

        };


    script.onerror =
        function () {

            startButton.disabled =
                false;

            startButton.textContent =
                "▶ TENTAR NOVAMENTE";

            loading.style.display =
                "none";

            alert(
                "Não foi possível carregar o EmulatorJS."
            );

        };


    document.body.appendChild(
        script
    );

}


/* =========================================================
   VOLTAR
========================================================= */

function goBack() {

    /*
       Sai do fullscreen antes de voltar.
    */

    if (
        document.fullscreenElement &&
        document.exitFullscreen
    ) {

        document
            .exitFullscreen()
            .catch(
                () => {}
            );

    }


    /*
       Volta para o index.
    */

    window.location.href =
        "index.html";

}


/* =========================================================
   QUANDO SAI DO FULLSCREEN
========================================================= */

document.addEventListener(
    "fullscreenchange",
    function () {

        console.log(
            "Fullscreen:",
            !!document.fullscreenElement
        );

    }
);


/* =========================================================
   QUANDO MUDA A ORIENTAÇÃO
========================================================= */

if (screen.orientation) {

    screen.orientation.addEventListener(
        "change",
        function () {

            console.log(
                "Orientação:",
                screen.orientation.type
            );

        }
    );

}


/* =========================================================
   TENTAR HORIZONTAL QUANDO A PÁGINA
   FOR ABERTA JÁ EM LANDSCAPE
========================================================= */

window.addEventListener(
    "load",
    function () {

        /*
           Não chamamos fullscreen aqui porque
           o navegador pode bloquear sem toque.
        */

        console.log(
            "Retro Player pronto."
        );

        console.log(
            "Jogo:",
            normalizedGamePath
        );

        console.log(
            "Sistema:",
            system
        );

    }
);

</script>

</body>

</html>
