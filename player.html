<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Player</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}
#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}
#backButton {
    position: fixed;
    z-index: 999999;
    left: 10px;
    bottom: 10px;
    border: 1px solid #555;
    border-radius: 10px;
    padding: 10px 14px;
    color: white;
    background: rgba(20,20,20,.8);
    font-size: 14px;
    font-weight: bold;
}
#backButton.hidden {
    display: none;
}
#startScreen, #errorScreen {
    position: fixed;
    z-index: 999998;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: white;
    text-align: center;
    background: #000;
}
#gameTitle {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 25px;
}
#startButton, #errorBack {
    padding: 14px 25px;
    border: 0;
    border-radius: 9px;
    background: white;
    color: black;
    font-size: 17px;
    font-weight: bold;
}
#loadingText {
    display: none;
    margin-top: 18px;
    color: #aaa;
}
#errorScreen {
    display: none;
    z-index: 1000000;
}
#errorMessage {
    max-width: 600px;
    margin-top: 10px;
    color: #ccc;
    line-height: 1.5;
    overflow-wrap: anywhere;
}
#errorBack {
    margin-top: 20px;
}
#rotateScreen {
    display: none;
}
@media (orientation: portrait) and (max-width: 900px) {
    #rotateScreen {
        display: flex;
        position: fixed;
        z-index: 2000000;
        inset: 0;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 25px;
        color: white;
        background: #000;
        text-align: center;
        font-weight: bold;
    }
}
@media (orientation: landscape) {
    #rotateScreen {
        display: none !important;
    }
}
</style>

<script>
window.EJS_DATA = "https://cdn.emulatorjs.org/stable/data/";

/* O core grava o arquivo SRAM periodicamente. */
window.EJS_fixedSaveInterval = 7000;

/* Não desative o armazenamento do EmulatorJS. */
window.EJS_disableLocalStorage = false;

/* Apenas observa atualizações do save; não substitui o sistema nativo. */
window.EJS_onSaveUpdate = function(event) {
    console.log("EmulatorJS detectou alteração no save:", event);
};

window.EJS_onSaveSave = function(event) {
    console.log("EmulatorJS acionou salvar arquivos SAV.", event);
};

window.EJS_onGameStart = function() {
    console.log("Jogo iniciado.");
};
</script>
</head>

<body>
<div id="game"></div>

<button id="backButton" type="button">← Voltar</button>

<div id="startScreen">
    <div id="gameTitle">Carregando jogo...</div>
    <button id="startButton" type="button">▶ INICIAR JOGO</button>
    <div id="loadingText">Carregando EmulatorJS...</div>
</div>

<div id="errorScreen">
    <strong>Erro ao carregar o jogo</strong>
    <div id="errorMessage"></div>
    <button id="errorBack" type="button">← Voltar</button>
</div>

<div id="rotateScreen">
    <div style="font-size:48px;margin-bottom:15px">📱↔️</div>
    Gire o celular para a horizontal para jogar.
</div>

<script>
(function() {
    "use strict";

    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const loadingText = document.getElementById("loadingText");
    const gameTitle = document.getElementById("gameTitle");
    const errorScreen = document.getElementById("errorScreen");
    const errorMessage = document.getElementById("errorMessage");
    const backButton = document.getElementById("backButton");

    function showError(message) {
        startScreen.style.display = "none";
        errorScreen.style.display = "flex";
        errorMessage.textContent = message;
    }

    function goBack() {
        window.location.href = "index.html";
    }

    backButton.addEventListener("click", goBack);
    document.getElementById("errorBack").addEventListener("click", goBack);

    const params = new URLSearchParams(window.location.search);
    let gamePath = params.get("game");

    if (!gamePath) {
        showError("Nenhum jogo foi informado. Abra o jogo pela página inicial.");
        return;
    }

    gamePath = gamePath.replace(/^\/+/, "").replace(/\\/g, "/");

    if (gamePath.split("/").includes("..")) {
        showError("Caminho de jogo inválido.");
        return;
    }

    const lowerPath = gamePath.toLowerCase();
    let system;

    if (/\.(gb|gbc)$/.test(lowerPath)) {
        system = "gb";
    } else if (/\.(sfc|smc|fig|swc|bsx)$/.test(lowerPath)) {
        system = "snes";
    } else {
        showError("Formato não reconhecido. Use uma ROM GB, GBC ou SNES.");
        return;
    }

    const fileName = gamePath.split("/").pop();
    const gameName = fileName.replace(/\.[^/.]+$/, "");
    gameTitle.textContent = gameName.replace(/[_-]/g, " ");
    document.title = gameName + " - Player";

    const romURL =
        "https://raw.githubusercontent.com/Rique106br/Pokemon-red-nft/main/" +
        gamePath.split("/").map(encodeURIComponent).join("/");

    /*
     * ID estável para cada caminho de ROM.
     */
    function createGameID(text) {
        let hash = 2166136261;
        for (let i = 0; i < text.length; i++) {
            hash ^= text.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0) % 2147483647 || 1;
    }

    window.EJS_player = "#game";
    window.EJS_core = system;
    window.EJS_gameUrl = romURL;

    /*
     * O nome também inclui o caminho para distinguir jogos
     * com o mesmo nome em pastas diferentes.
     */
    window.EJS_gameName = gamePath.replace(/\.[^/.]+$/, "");
    window.EJS_gameID = createGameID(gamePath);

    window.EJS_pathtodata = window.EJS_DATA;
    window.EJS_startOnLoaded = false;
    window.EJS_fullscreenOnLoaded = false;
    window.EJS_language = "pt-BR";
    window.EJS_threads = false;
    window.EJS_volume = 0.8;
    window.EJS_biosUrl = "";
    window.EJS_controlScheme = system;
    window.EJS_browserMode = "mobile";
    window.EJS_color = "#ffffff";
    window.EJS_backgroundColor = "#000000";
    window.EJS_AdUrl = "";

    let started = false;

    startButton.addEventListener("click", async function() {
        if (started) return;
        started = true;

        startButton.disabled = true;
        startButton.style.display = "none";
        loadingText.style.display = "block";
        startScreen.style.display = "none";

        try {
            if (document.documentElement.requestFullscreen) {
                await document.documentElement.requestFullscreen();
            }
        } catch (_) {}

        try {
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock("landscape");
            }
        } catch (_) {}

        const loader = document.createElement("script");
        loader.src = window.EJS_DATA + "loader.js";
        loader.async = true;

        loader.onload = function() {
            loadingText.style.display = "none";
        };

        loader.onerror = function() {
            showError("Não foi possível carregar o EmulatorJS. Confira a conexão.");
        };

        document.body.appendChild(loader);
    });

    /*
     * Esconde o botão Voltar durante o jogo para não cobrir
     * os controles. Toque no canto inferior esquerdo para
     * fazê-lo reaparecer.
     */
    let hideTimer;

    function showBackButton() {
        backButton.classList.remove("hidden");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function() {
            backButton.classList.add("hidden");
        }, 3500);
    }

    document.addEventListener("pointerdown", showBackButton, { passive: true });

    console.log("ROM:", gamePath);
    console.log("Sistema:", system);
    console.log("URL:", romURL);
    console.log("Game ID:", window.EJS_gameID);
})();
</script>
</body>
</html>
