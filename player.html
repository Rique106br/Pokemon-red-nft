<meta name="theme-color" content="#000000"><title>Retro Player</title><style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000;
}


/* =====================================================
   EMULATORJS
===================================================== */

#game {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000;

    overflow: hidden;

}


/* =====================================================
   BARRA
===================================================== */

#topbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 45px;

    z-index: 900000;

    display: flex;

    align-items: center;

    padding: 5px 9px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.85),
            rgba(0,0,0,.30)
        );

    transition:
        opacity .25s ease;

}

#backButton {

    border: 1px solid #444;

    background: #181818;

    color: #fff;

    border-radius: 8px;

    padding: 7px 11px;

    font-size: 13px;

    font-weight: bold;

}

#backButton:active {

    transform: scale(.95);

}

#gameTitle {

    flex: 1;

    min-width: 0;

    margin-left: 9px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;

    font-weight: bold;

}


/* =====================================================
   TELA INICIAL
===================================================== */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 1000000;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 20px;

    background:

        radial-gradient(
            circle at center,
            #222 0%,
            #0b0b0b 50%,
            #000 100%
        );

}

#startIcon {

    font-size: 55px;

    margin-bottom: 10px;

}

#startTitle {

    max-width: 90vw;

    font-size: 26px;

    font-weight: bold;

    margin-bottom: 8px;

    word-break: break-word;

}

#startSystem {

    color: #aaa;

    font-size: 14px;

    margin-bottom: 22px;

}

#startButton {

    border: 0;

    border-radius: 12px;

    padding: 14px 28px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: bold;

}

#startButton:active {

    transform: scale(.96);

}


/* =====================================================
   ERRO
===================================================== */

#errorScreen {

    position: fixed;

    inset: 0;

    z-index: 2000000;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px;

    background: #000;

}

#errorScreen h2 {

    margin-bottom: 10px;

}

#errorScreen p {

    color: #aaa;

    max-width: 450px;

    line-height: 1.5;

}

#errorBack {

    border: 0;

    border-radius: 9px;

    padding: 12px 20px;

    background: #fff;

    color: #000;

    font-weight: bold;

}


/* =====================================================
   AVISO VERTICAL
===================================================== */

#portraitWarning {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 1500000;

    background: #000;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    text-align: center;

    padding: 25px;

}

.rotateIcon {

    font-size: 55px;

    margin-bottom: 15px;

}

#portraitWarning strong {

    font-size: 20px;

}

#portraitWarning span {

    margin-top: 8px;

    color: #aaa;

}


/* =====================================================
   RETRATO
===================================================== */

@media screen
       and (orientation: portrait)
       and (max-width: 800px) {

    #portraitWarning {

        display: flex;

    }

    #topbar {

        display: none;

    }

}


/* =====================================================
   HORIZONTAL
===================================================== */

@media screen
       and (orientation: landscape) {

    #game {

        width: 100vw;
        height: 100vh;

    }

}


/* =====================================================
   CELULAR HORIZONTAL
===================================================== */

@media screen
       and (orientation: landscape)
       and (max-height: 600px) {

    #topbar {

        height: 38px;

        padding: 3px 8px;

    }

    #backButton {

        padding: 5px 9px;

        font-size: 12px;

    }

    #gameTitle {

        font-size: 12px;

    }

    #startIcon {

        font-size: 40px;

    }

    #startTitle {

        font-size: 21px;

    }

    #startSystem {

        margin-bottom: 12px;

    }

    #startButton {

        padding: 10px 22px;

        font-size: 14px;

    }

}


/* =====================================================
   FULLSCREEN
===================================================== */

:fullscreen {

    width: 100vw !important;
    height: 100vh !important;

    background: #000 !important;

}

:-webkit-full-screen {

    width: 100vw !important;
    height: 100vh !important;

    background: #000 !important;

}

</style></head><body><!-- =====================================================
     EMULATORJS
===================================================== --><div id="game"></div><!-- =====================================================
     BARRA
===================================================== --><div id="topbar"><button
    id="backButton"
    onclick="goBack()">

    ← Voltar

</button>

<div id="gameTitle">
    Retro Player
</div>

</div><!-- =====================================================
     TELA INICIAL
===================================================== --><div id="startScreen"><div id="startIcon">
    🎮
</div>

<div id="startTitle">
    Retro Player
</div>

<div id="startSystem">
    Preparando jogo...
</div>

<button
    id="startButton"
    onclick="startGame()">

    ▶ INICIAR JOGO

</button>

</div><!-- =====================================================
     ERRO
===================================================== --><div id="errorScreen"><h2>
    ❌ Erro
</h2>

<p id="errorText">
    Não foi possível abrir o jogo.
</p>

<button
    id="errorBack"
    onclick="goBack()">

    ← Voltar

</button>

</div><!-- =====================================================
     AVISO VERTICAL
===================================================== --><div id="portraitWarning"><div class="rotateIcon">
    📱↻
</div>

<strong>
    Vire o celular
</strong>

<span>
    Coloque o celular na horizontal
    para jogar.
</span>

</div><script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const GITHUB_USER =
    "Rique106br";

const GITHUB_REPO =
    "Pokemon-red-nft";

const GITHUB_BRANCH =
    "main";

const EJS_DATA =
    "https://cdn.emulatorjs.org/stable/data/";


/* =====================================================
   ELEMENTOS
===================================================== */

const game =
    document.getElementById("game");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const startTitle =
    document.getElementById("startTitle");

const startSystem =
    document.getElementById("startSystem");

const gameTitle =
    document.getElementById("gameTitle");

const errorScreen =
    document.getElementById("errorScreen");

const errorText =
    document.getElementById("errorText");


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const rawGamePath =
    params.get("game");


/* =====================================================
   NORMALIZAR CAMINHO
===================================================== */

function normalizePath(path) {

    if (!path) {

        return "";

    }

    try {

        path =
            decodeURIComponent(path);

    }
    catch (e) {

        /* Já estava decodificado */

    }

    return path
        .replace(/^\/+/, "")
        .replace(/\\/g, "/");

}


const gamePath =
    normalizePath(
        rawGamePath
    );


/* =====================================================
   NOME DO JOGO
===================================================== */

function getGameName(path) {

    if (!path) {

        return "Retro Player";

    }

    const parts =
        path.split("/");

    let filename =
        parts[
            parts.length - 1
        ];


    filename =
        filename.replace(
            /\.[^/.]+$/,
            ""
        );


    return filename
        .replace(
            /[_-]+/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


const gameName =
    getGameName(
        gamePath
    );


/* =====================================================
   SISTEMA
===================================================== */

function getSystem(path) {

    const lower =
        path.toLowerCase();


    if (
        lower.endsWith(".gb") ||
        lower.endsWith(".gbc") ||
        lower.startsWith("gb/")
    ) {

        return "gb";

    }


    if (
        lower.endsWith(".sfc") ||
        lower.endsWith(".smc") ||
        lower.endsWith(".fig") ||
        lower.endsWith(".swc") ||
        lower.endsWith(".bsx") ||
        lower.startsWith("snes/")
    ) {

        return "snes";

    }


    return null;

}


const system =
    getSystem(
        gamePath
    );


/* =====================================================
   INTERFACE
===================================================== */

startTitle.textContent =
    gameName;

gameTitle.textContent =
    gameName;


if (system === "gb") {

    startSystem.textContent =
        "🎮 Game Boy";

}
else if (system === "snes") {

    startSystem.textContent =
        "🕹️ Super Nintendo";

}
else {

    startSystem.textContent =
        "Sistema não reconhecido";

}


/* =====================================================
   VALIDAR
===================================================== */

if (
    !gamePath ||
    !system
) {

    startScreen.style.display =
        "none";

    errorScreen.style.display =
        "flex";

    errorText.textContent =
        "Jogo inválido. " +
        "Use, por exemplo: " +
        "player.html?game=gb/pokemon_red.gb";

}


/* =====================================================
   URL DA ROM
===================================================== */

function getRomURL(path) {

    const encoded =
        path
            .split("/")
            .map(
                part =>
                    encodeURIComponent(part)
            )
            .join("/");


    return (
        "https://raw.githubusercontent.com/" +
        GITHUB_USER +
        "/" +
        GITHUB_REPO +
        "/" +
        GITHUB_BRANCH +
        "/" +
        encoded
    );

}


/* =====================================================
   FULLSCREEN
===================================================== */

async function enterFullscreen() {

    try {

        if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ) {

            await document
                .documentElement
                .requestFullscreen();

        }

    }
    catch (error) {

        console.log(
            "Fullscreen não permitido:",
            error
        );

    }


    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    }
    catch (error) {

        console.log(
            "Landscape não permitido:",
            error
        );

    }

}


/* =====================================================
   ID ÚNICO DO JOGO
===================================================== */

function createGameID(path) {

    let hash = 0;


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        hash =
            (
                (
                    hash << 5
                )
                -
                hash
                +
                path.charCodeAt(i)
            ) | 0;

    }


    /*
       Nunca usar 0.

       O ID precisa ser estável:
       mesma ROM = mesmo ID.
    */

    hash =
        Math.abs(hash);


    if (hash === 0) {

        hash = 1;

    }


    return hash;

}


const gameID =
    createGameID(
        gamePath
    );


/* =====================================================
   SALVAR AGORA
===================================================== */

function saveGameNow() {

    try {

        const emulator =
            window.EJS_emulator;


        if (
            emulator &&
            emulator.gameManager &&
            typeof emulator.gameManager.saveSaveFiles ===
                "function"
        ) {

            emulator.gameManager
                .saveSaveFiles();

            console.log(
                "SAVE SRAM gravado."
            );

            return true;

        }

    }
    catch (error) {

        console.error(
            "Erro ao gravar SRAM:",
            error
        );

    }


    return false;

}


/* =====================================================
   EMULATORJS PRONTO
===================================================== */

window.EJS_ready =
    function () {

        console.log(
            "EmulatorJS pronto."
        );

    };


/* =====================================================
   JOGO INICIADO
===================================================== */

window.EJS_onGameStart =
    function () {

        console.log(
            "Jogo iniciado."
        );


        startScreen.style.display =
            "none";


        document
            .getElementById("topbar")
            .style.opacity =
                "0";


        setTimeout(
            function () {

                document
                    .getElementById("topbar")
                    .style.opacity =
                        "1";

            },
            1000
        );

    };


/* =====================================================
   QUANDO O SAVE DO JOGO MUDAR
===================================================== */

window.EJS_onSaveUpdate =
    function (event) {

        console.log(
            "Pokémon alterou o save."
        );


        /*
           O EmulatorJS já detectou a alteração.
           Forçamos a persistência.
        */

        setTimeout(
            function () {

                saveGameNow();

            },
            100
        );

    };


/* =====================================================
   QUANDO O EMULATORJS SALVAR
===================================================== */

window.EJS_onSaveSave =
    function (event) {

        console.log(
            "Arquivo SAV solicitado."
        );

    };


/* =====================================================
   INICIAR JOGO
===================================================== */

async function startGame() {

    if (
        !gamePath ||
        !system
    ) {

        return;

    }


    /* -----------------------------------------------
       FULLSCREEN
    ----------------------------------------------- */

    await enterFullscreen();


    /* -----------------------------------------------
       CONFIGURAÇÃO BÁSICA
    ----------------------------------------------- */

    window.EJS_player =
        "#game";


    window.EJS_gameUrl =
        getRomURL(
            gamePath
        );


    /*
       IMPORTANTE:

       O nome e o ID ficam fixos para
       o save ser encontrado novamente.
    */

    window.EJS_gameName =
        gameName;


    window.EJS_gameID =
        gameID;


    window.EJS_pathtodata =
        EJS_DATA;


    /* -----------------------------------------------
       CORE
    ----------------------------------------------- */

    window.EJS_core =
        system;


    /* -----------------------------------------------
       INÍCIO
    ----------------------------------------------- */

    window.EJS_startOnLoaded =
        true;


    window.EJS_fullscreenOnLoaded =
        false;


    /* -----------------------------------------------
       IDIOMA
    ----------------------------------------------- */

    window.EJS_language =
        "pt-BR";


    window.EJS_disableAutoLang =
        false;


    /* -----------------------------------------------
       PERFORMANCE
    ----------------------------------------------- */

    window.EJS_threads =
        false;


    /* -----------------------------------------------
       ÁUDIO
    ----------------------------------------------- */

    window.EJS_volume =
        0.8;


    /* -----------------------------------------------
       BIOS
    ----------------------------------------------- */

    window.EJS_biosUrl =
        "";


    /* -----------------------------------------------
       CONTROLES MOBILE
    ----------------------------------------------- */

    window.EJS_controlScheme =
        system;


    window.EJS_browserMode =
        "mobile";


    /* -----------------------------------------------
       VISUAL
    ----------------------------------------------- */

    window.EJS_color =
        "#ffffff";


    window.EJS_backgroundColor =
        "#000000";


    /* -----------------------------------------------
       SEM ANÚNCIO
    ----------------------------------------------- */

    window.EJS_AdUrl =
        "";


    /* =================================================
       CONFIGURAÇÃO REAL DE SAVE
    ================================================= */

    /*
       Mantém armazenamento local habilitado.
    */

    window.EJS_disableLocalStorage =
        false;


    /*
       Salva os SAVE FILES no navegador.
    */

    window.EJS_defaultOptions = {

        "save-state-location":
            "browser"

    };


    /*
       FORÇA o núcleo a gravar o SRAM
       a cada 7 segundos.

       Isso é especialmente importante
       para Pokémon Red.
    */

    window.EJS_fixedSaveInterval =
        7000;


    /*
       A tela de configurações não precisa
       ser alterada.
    */


    /* -----------------------------------------------
       REMOVE NOSSA TELA
    ----------------------------------------------- */

    startScreen.style.display =
        "none";


    /* -----------------------------------------------
       EVITA DOIS LOADERS
    ----------------------------------------------- */

    const old =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (old) {

        old.remove();

    }


    /* -----------------------------------------------
       CARREGAR EMULATORJS
    ----------------------------------------------- */

    const script =
        document.createElement(
            "script"
        );


    script.id =
        "emulatorjs-loader";


    script.src =
        EJS_DATA +
        "loader.js";


    script.async =
        true;


    script.onerror =
        function () {

            errorScreen.style.display =
                "flex";


            errorText.textContent =
                "Não foi possível carregar o EmulatorJS.";

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   SALVAR ANTES DE SAIR
===================================================== */

window.addEventListener(
    "pagehide",
    function () {

        saveGameNow();

    }
);


/* =====================================================
   SALVAR QUANDO A ABA FICA OCULTA
===================================================== */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            saveGameNow();

        }

    }
);


/* =====================================================
   VOLTAR
===================================================== */

function goBack() {

    /*
       Primeiro salva.
    */

    saveGameNow();


    /*
       Depois sai do fullscreen.
    */

    try {

        if (
            document.fullscreenElement &&
            document.exitFullscreen
        ) {

            document
                .exitFullscreen();

        }

    }
    catch (e) {}


    /*
       Volta para a página inicial.
    */

    window.location.href =
        "index.html";

}


/* =====================================================
   BARRA SUPERIOR
===================================================== */

let barTimer =
    null;


function showBarTemporarily() {

    const bar =
        document.getElementById(
            "topbar"
        );


    bar.style.opacity =
        "1";


    clearTimeout(
        barTimer
    );


    barTimer =
        setTimeout(
            function () {

                bar.style.opacity =
                    "0";

            },
            2500
        );

}


document.addEventListener(
    "click",
    function () {

        if (
            window.EJS_emulator
        ) {

            showBarTemporarily();

        }

    }
);


/* =====================================================
   LOG
===================================================== */

console.log(
    "================================"
);

console.log(
    "RETRO PLAYER"
);

console.log(
    "ROM:",
    gamePath
);

console.log(
    "CORE:",
    system
);

console.log(
    "GAME ID:",
    gameID
);

console.log(
    "SAVE:",
    "SRAM automático a cada 7 segundos"
);

console.log(
    "================================"
);

</script></body></html>
