<meta name="theme-color" content="#000000"><title>Retro Player</title><style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000;
}


/* =====================================================
   EMULATORJS
===================================================== */

#game {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000;

    overflow: hidden;

}


/* =====================================================
   BARRA SUPERIOR
===================================================== */

#topbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 45px;

    z-index: 900000;

    display: flex;

    align-items: center;

    padding: 5px 9px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.90),
            rgba(0,0,0,.30)
        );

    transition:
        opacity .3s ease;

}

#backButton {

    border: 1px solid #444;

    background: #181818;

    color: #fff;

    border-radius: 8px;

    padding: 7px 11px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

}

#backButton:active {

    transform: scale(.95);

}

#gameTitle {

    flex: 1;

    min-width: 0;

    margin-left: 9px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;

    font-weight: bold;

}


/* =====================================================
   TELA INICIAL
===================================================== */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 1000000;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at center,
            #222 0%,
            #0b0b0b 50%,
            #000 100%
        );

}

#startIcon {

    font-size: 55px;

    margin-bottom: 10px;

}

#startTitle {

    max-width: 90vw;

    font-size: 26px;

    font-weight: bold;

    margin-bottom: 8px;

    word-break: break-word;

}

#startSystem {

    color: #aaa;

    font-size: 14px;

    margin-bottom: 22px;

}

#startButton {

    border: 0;

    border-radius: 12px;

    padding: 14px 28px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

#startButton:active {

    transform: scale(.96);

}


/* =====================================================
   ERRO
===================================================== */

#errorScreen {

    position: fixed;

    inset: 0;

    z-index: 2000000;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px;

    background: #000;

}

#errorScreen h2 {

    margin-bottom: 10px;

}

#errorScreen p {

    color: #aaa;

    max-width: 450px;

    line-height: 1.5;

}

#errorBack {

    border: 0;

    border-radius: 9px;

    padding: 12px 20px;

    background: #fff;

    color: #000;

    font-weight: bold;

}


/* =====================================================
   AVISO VERTICAL
===================================================== */

#portraitWarning {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 1500000;

    background: #000;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    text-align: center;

    padding: 25px;

}

.rotateIcon {

    font-size: 55px;

    margin-bottom: 15px;

}

#portraitWarning strong {

    font-size: 20px;

}

#portraitWarning span {

    margin-top: 8px;

    color: #aaa;

}


/* =====================================================
   RETRATO
===================================================== */

@media screen
       and (orientation: portrait)
       and (max-width: 800px) {

    #portraitWarning {

        display: flex;

    }

    #topbar {

        display: none;

    }

}


/* =====================================================
   HORIZONTAL
===================================================== */

@media screen
       and (orientation: landscape) {

    #game {

        width: 100vw;
        height: 100vh;

    }

}


/* =====================================================
   CELULAR HORIZONTAL
===================================================== */

@media screen
       and (orientation: landscape)
       and (max-height: 600px) {

    #topbar {

        height: 38px;

        padding: 3px 8px;

    }

    #backButton {

        padding: 5px 9px;

        font-size: 12px;

    }

    #gameTitle {

        font-size: 12px;

    }

    #startIcon {

        font-size: 40px;

    }

    #startTitle {

        font-size: 21px;

    }

    #startSystem {

        margin-bottom: 12px;

    }

    #startButton {

        padding: 10px 22px;

        font-size: 14px;

    }

}


/* =====================================================
   FULLSCREEN
===================================================== */

:fullscreen {

    width: 100vw !important;
    height: 100vh !important;

    background: #000 !important;

}

:-webkit-full-screen {

    width: 100vw !important;
    height: 100vh !important;

    background: #000 !important;

}

</style></head><body><!-- =====================================================
     ÁREA DO EMULATORJS
===================================================== --><div id="game"></div><!-- =====================================================
     BARRA SUPERIOR
===================================================== --><div id="topbar"><button
    id="backButton"
    onclick="goBack()">

    ← Voltar

</button>

<div id="gameTitle">
    Retro Player
</div>

</div><!-- =====================================================
     TELA INICIAL
===================================================== --><div id="startScreen"><div id="startIcon">
    🎮
</div>

<div id="startTitle">
    Retro Player
</div>

<div id="startSystem">
    Preparando jogo...
</div>

<button
    id="startButton"
    onclick="startGame()">

    ▶ INICIAR JOGO

</button>

</div><!-- =====================================================
     ERRO
===================================================== --><div id="errorScreen"><h2>
    ❌ Erro
</h2>

<p id="errorText">
    Não foi possível abrir o jogo.
</p>

<button
    id="errorBack"
    onclick="goBack()">

    ← Voltar

</button>

</div><!-- =====================================================
     AVISO PARA VIRAR O CELULAR
===================================================== --><div id="portraitWarning"><div class="rotateIcon">
    📱↻
</div>

<strong>
    Vire o celular
</strong>

<span>
    Coloque o celular na horizontal
    para jogar.
</span>

</div><script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const GITHUB_USER =
    "Rique106br";

const GITHUB_REPO =
    "Pokemon-red-nft";

const GITHUB_BRANCH =
    "main";

const EJS_DATA =
    "https://cdn.emulatorjs.org/stable/data/";


/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const startTitle =
    document.getElementById(
        "startTitle"
    );

const startSystem =
    document.getElementById(
        "startSystem"
    );

const gameTitle =
    document.getElementById(
        "gameTitle"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorText =
    document.getElementById(
        "errorText"
    );


/* =====================================================
   LER URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const rawGamePath =
    params.get("game");


/* =====================================================
   NORMALIZAR CAMINHO
===================================================== */

function normalizePath(path) {

    if (!path) {

        return "";

    }

    try {

        path =
            decodeURIComponent(path);

    }
    catch (error) {

        console.log(
            "URL já estava decodificada."
        );

    }

    return path
        .replace(/^\/+/, "")
        .replace(/\\/g, "/");

}


const gamePath =
    normalizePath(
        rawGamePath
    );


/* =====================================================
   NOME DO JOGO
===================================================== */

function getGameName(path) {

    if (!path) {

        return "Retro Player";

    }

    const parts =
        path.split("/");

    let filename =
        parts[
            parts.length - 1
        ];

    filename =
        filename.replace(
            /\.[^/.]+$/,
            ""
        );

    return filename
        .replace(
            /[_-]+/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


const gameName =
    getGameName(
        gamePath
    );


/* =====================================================
   DESCOBRIR EXTENSÃO
===================================================== */

function getExtension(path) {

    const match =
        path.match(
            /\.([^.\/]+)$/
        );

    if (!match) {

        return "";

    }

    return match[1]
        .toLowerCase();

}


/* =====================================================
   DESCOBRIR SISTEMA
===================================================== */

function getSystem(path) {

    const lower =
        path.toLowerCase();


    /* -----------------------------
       GAME BOY / GAME BOY COLOR
    ----------------------------- */

    if (
        lower.endsWith(".gb") ||
        lower.endsWith(".gbc") ||
        lower.startsWith("gb/")
    ) {

        return "gb";

    }


    /* -----------------------------
       SNES
    ----------------------------- */

    if (
        lower.endsWith(".sfc") ||
        lower.endsWith(".smc") ||
        lower.endsWith(".fig") ||
        lower.endsWith(".swc") ||
        lower.endsWith(".bsx") ||
        lower.startsWith("snes/")
    ) {

        return "snes";

    }


    return null;

}


const system =
    getSystem(
        gamePath
    );


/* =====================================================
   DESCOBRIR SE É GBC
===================================================== */

const extension =
    getExtension(
        gamePath
    );

const isGBC =
    extension === "gbc";


/* =====================================================
   ATUALIZAR TÍTULO
===================================================== */

startTitle.textContent =
    gameName;

gameTitle.textContent =
    gameName;


/* =====================================================
   TEXTO DO SISTEMA
===================================================== */

if (isGBC) {

    startSystem.textContent =
        "🎨 Game Boy Color";

}
else if (system === "gb") {

    startSystem.textContent =
        "🎮 Game Boy • Colorização";

}
else if (system === "snes") {

    startSystem.textContent =
        "🕹️ Super Nintendo";

}
else {

    startSystem.textContent =
        "❓ Sistema não reconhecido";

}


/* =====================================================
   VALIDAR
===================================================== */

if (
    !gamePath ||
    !system
) {

    startScreen.style.display =
        "none";

    errorScreen.style.display =
        "flex";

    errorText.textContent =
        "Jogo inválido. " +
        "Use, por exemplo: " +
        "player.html?game=gb/pokemon_red.gb";

}


/* =====================================================
   URL DA ROM
===================================================== */

function getRomURL(path) {

    const encodedPath =
        path
            .split("/")
            .map(
                part =>
                    encodeURIComponent(
                        part
                    )
            )
            .join("/");


    return (
        "https://raw.githubusercontent.com/" +
        GITHUB_USER +
        "/" +
        GITHUB_REPO +
        "/" +
        GITHUB_BRANCH +
        "/" +
        encodedPath
    );

}


/* =====================================================
   FULLSCREEN
===================================================== */

async function enterFullscreen() {

    try {

        if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ) {

            await document
                .documentElement
                .requestFullscreen();

        }

    }
    catch (error) {

        console.log(
            "Fullscreen bloqueado:",
            error
        );

    }


    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    }
    catch (error) {

        console.log(
            "Landscape bloqueado pelo navegador:",
            error
        );

    }

}


/* =====================================================
   ID DO JOGO
===================================================== */

function createGameID(path) {

    let hash = 0;


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        hash =
            (
                (
                    hash << 5
                )
                -
                hash
                +
                path.charCodeAt(i)
            ) | 0;

    }


    return Math.abs(hash);

}


/* =====================================================
   CONFIGURAÇÕES EXTRAS PARA GAME BOY
===================================================== */

/*
   ROM .gb:

   O núcleo Gambatte consegue executar GB.
   A colorização é aplicada pelo próprio
   sistema quando disponível.

   ROM .gbc:

   Continua usando o mesmo núcleo,
   mas a ROM é identificada como GBC.
*/


function configureGameBoy() {

    /*
       Gambatte é o núcleo usado para GB/GBC.
    */

    window.EJS_core =
        "gambatte";


    /*
       Controle Game Boy.
    */

    window.EJS_controlScheme =
        "gb";


    /*
       Ativa o modo mobile.
    */

    window.EJS_browserMode =
        "mobile";


    /*
       Para ROM .gb, pedimos uma apresentação
       colorida quando o frontend/core suportar
       essa opção.
    */

    if (!isGBC) {

        window.EJS_gbColor =
            true;

    }

}


/* =====================================================
   CONFIGURAR SNES
===================================================== */

function configureSNES() {

    /*
       Núcleo SNES.
    */

    window.EJS_core =
        "snes9x";


    /*
       Controles SNES.
    */

    window.EJS_controlScheme =
        "snes";


    /*
       Interface mobile.
    */

    window.EJS_browserMode =
        "mobile";

}


/* =====================================================
   QUANDO EMULATORJS ESTIVER PRONTO
===================================================== */

window.EJS_ready =
    function () {

        console.log(
            "EmulatorJS pronto."
        );

    };


/* =====================================================
   QUANDO O JOGO COMEÇAR
===================================================== */

window.EJS_onGameStart =
    function () {

        console.log(
            "Jogo iniciado."
        );


        /*
           Remove a tela inicial.
        */

        startScreen.style.display =
            "none";


        /*
           A barra fica transparente
           depois que o jogo inicia.
        */

        const topbar =
            document.getElementById(
                "topbar"
            );

        topbar.style.opacity =
            "0";


        /*
           Volta temporariamente ao tocar.
        */

        setTimeout(
            function () {

                topbar.style.opacity =
                    "1";

            },
            1200
        );

    };


/* =====================================================
   INICIAR JOGO
===================================================== */

async function startGame() {

    if (
        !gamePath ||
        !system
    ) {

        return;

    }


    /*
       Fullscreen precisa ocorrer
       durante o toque do usuário.
    */

    await enterFullscreen();


    /*
       Configura ROM.
    */

    window.EJS_gameUrl =
        getRomURL(
            gamePath
        );


    window.EJS_gameName =
        gameName;


    window.EJS_gameID =
        createGameID(
            gamePath
        );


    /*
       Localização dos arquivos
       do EmulatorJS.
    */

    window.EJS_pathtodata =
        EJS_DATA;


    /*
       Iniciar automaticamente
       quando o EmulatorJS estiver pronto.
    */

    window.EJS_startOnLoaded =
        true;


    /*
       Já entramos em fullscreen
       pelo botão.
    */

    window.EJS_fullscreenOnLoaded =
        false;


    /*
       Idioma.
    */

    window.EJS_language =
        "pt-BR";


    /*
       Volume.
    */

    window.EJS_volume =
        0.8;


    /*
       Sem BIOS.
    */

    window.EJS_biosUrl =
        "";


    /*
       Sem threads para manter
       compatibilidade com GitHub Pages.
    */

    window.EJS_threads =
        false;


    /*
       Cor da interface.
    */

    window.EJS_color =
        "#ffffff";


    /*
       Fundo.
    */

    window.EJS_backgroundColor =
        "#000000";


    /*
       Mouse desativado.
    */

    window.EJS_mouse =
        false;


    /*
       Multitap desativado.
    */

    window.EJS_multitap =
        false;


    /* =================================================
       ESCOLHER CORE
    ================================================= */


    if (system === "gb") {

        configureGameBoy();

    }
    else if (system === "snes") {

        configureSNES();

    }


    /*
       Remove loader anterior se existir.
    */

    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (oldLoader) {

        oldLoader.remove();

    }


    /*
       Carrega EmulatorJS.
    */

    const script =
        document.createElement(
            "script"
        );


    script.id =
        "emulatorjs-loader";


    script.src =
        EJS_DATA +
        "loader.js";


    script.async =
        true;


    script.onerror =
        function () {

            errorScreen.style.display =
                "flex";

            errorText.textContent =
                "Não foi possível carregar o EmulatorJS.";

        };


    document.body.appendChild(
        script
    );


    /*
       Não existe uma tela de
       "Carregando EmulatorJS"
       por cima do jogo.

       O próprio EmulatorJS controla
       seu carregamento.
    */

    startScreen.style.display =
        "none";

}


/* =====================================================
   VOLTAR
===================================================== */

function goBack() {

    try {

        if (
            document.fullscreenElement &&
            document.exitFullscreen
        ) {

            document
                .exitFullscreen();

        }

    }
    catch (error) {}


    window.location.href =
        "index.html";

}


/* =====================================================
   MOSTRAR BARRA AO TOCAR
===================================================== */

let hideTimer =
    null;


document.addEventListener(
    "click",
    function () {

        const topbar =
            document.getElementById(
                "topbar"
            );


        if (
            startScreen.style.display ===
            "none"
        ) {

            topbar.style.opacity =
                "1";


            clearTimeout(
                hideTimer
            );


            hideTimer =
                setTimeout(
                    function () {

                        topbar.style.opacity =
                            "0";

                    },
                    2500
                );

        }

    }
);


/* =====================================================
   LOG
===================================================== */

console.log(
    "=============================="
);

console.log(
    "RETRO PLAYER"
);

console.log(
    "Jogo:",
    gamePath
);

console.log(
    "Sistema:",
    system
);

console.log(
    "Extensão:",
    extension
);

console.log(
    "GBC:",
    isGBC
);

console.log(
    "=============================="
);

</script></body></html>
