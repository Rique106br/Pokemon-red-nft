<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Player</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}
#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}
#startScreen, #errorScreen {
    position: fixed;
    inset: 0;
    z-index: 100000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background: #000;
    color: #fff;
    text-align: center;
}
#gameTitle {
    max-width: 90%;
    margin-bottom: 24px;
    font-size: 26px;
    font-weight: bold;
    overflow-wrap: anywhere;
}
#startButton, #errorBack {
    border: 0;
    border-radius: 10px;
    padding: 15px 25px;
    background: #fff;
    color: #000;
    font-size: 18px;
    font-weight: bold;
}
#loadingText {
    display: none;
    margin-top: 18px;
    color: #aaa;
}
#errorScreen {
    display: none;
    z-index: 200000;
}
#errorTitle {
    font-size: 23px;
    font-weight: bold;
}
#errorMessage {
    margin-top: 15px;
    max-width: 700px;
    color: #ccc;
    line-height: 1.5;
    overflow-wrap: anywhere;
}
#errorBack {
    margin-top: 22px;
}
#backButton {
    position: fixed;
    z-index: 99999;
    left: 10px;
    bottom: 10px;
    padding: 10px 14px;
    border: 1px solid #555;
    border-radius: 9px;
    background: rgba(20,20,20,.8);
    color: #fff;
    font-size: 14px;
    font-weight: bold;
}
#backButton.hidden {
    display: none;
}
#rotateScreen {
    display: none;
}
@media (orientation: portrait) and (max-width: 900px) {
    #rotateScreen {
        position: fixed;
        inset: 0;
        z-index: 300000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 25px;
        background: #000;
        color: #fff;
        text-align: center;
        font-weight: bold;
    }
}
@media (orientation: landscape) {
    #rotateScreen {
        display: none !important;
    }
}
</style>

<script>
(function () {
    "use strict";

    const params = new URLSearchParams(location.search);
    let path = params.get("game");

    const errorScreen = () => document.getElementById("errorScreen");

    function showError(message) {
        document.getElementById("startScreen").style.display = "none";
        errorScreen().style.display = "flex";
        document.getElementById("errorMessage").textContent = message;
    }

    window.playerShowError = showError;

    if (!path) {
        window.playerConfigError = "Nenhum jogo foi informado na URL.";
        window.EJS_gameUrl = "";
    } else {
        try {
            path = decodeURIComponent(path);
        } catch (_) {}

        path = path.replace(/^\/+/, "").replace(/\\/g, "/");

        if (path.split("/").includes("..")) {
            window.playerConfigError = "Caminho da ROM inválido.";
        }

        const lower = path.toLowerCase();
        let core = "";

        if (/\.(gb|gbc)$/.test(lower)) {
            core = "gb";
        } else if (/\.(sfc|smc|fig|swc|bsx)$/.test(lower)) {
            core = "snes";
        } else {
            window.playerConfigError =
                "Formato não reconhecido. Use uma ROM GB, GBC ou SNES.";
        }

        if (!window.playerConfigError) {
            const filename = path.split("/").pop();
            const name = filename.replace(/\.[^/.]+$/, "");

            let hash = 2166136261;
            for (let i = 0; i < path.length; i++) {
                hash ^= path.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            const gameID = (hash >>> 0) % 2147483647 || 1;

            window.EJS_player = "#game";
            window.EJS_core = core;
            window.EJS_gameUrl =
                "https://raw.githubusercontent.com/Rique106br/Pokemon-red-nft/main/" +
                path.split("/").map(encodeURIComponent).join("/");
            window.EJS_gameName = path.replace(/\.[^/.]+$/, "");
            window.EJS_gameID = gameID;
            window.EJS_pathtodata =
                "https://cdn.emulatorjs.org/stable/data/";

            /*
             * O emulador inicia enquanto a tela inicial fica
             * por cima. O botão apenas remove essa tela.
             */
            window.EJS_startOnLoaded = true;
            window.EJS_fullscreenOnLoaded = false;
            window.EJS_language = "pt-BR";
            window.EJS_threads = false;
            window.EJS_volume = 0.8;
            window.EJS_biosUrl = "";
            window.EJS_controlScheme = core;
            window.EJS_browserMode = "mobile";
            window.EJS_color = "#ffffff";
            window.EJS_backgroundColor = "#000000";
            window.EJS_AdUrl = "";

            /*
             * Configuração oficial do intervalo de gravação
             * do arquivo de save pelo EmulatorJS.
             */
            window.EJS_fixedSaveInterval = 7000;
            window.EJS_disableLocalStorage = false;

            window.EJS_onSaveUpdate = function (event) {
                console.log("EmulatorJS: save atualizado.", event);
            };

            window.EJS_onSaveSave = function (event) {
                console.log("EmulatorJS: evento de salvar arquivos.", event);
            };

            window.EJS_onGameStart = function () {
                console.log("EmulatorJS: jogo iniciado.");
            };

            document.addEventListener("DOMContentLoaded", function () {
                document.getElementById("gameTitle").textContent =
                    name.replace(/[_-]/g, " ");
                document.title = name + " - Player";
            });
        }
    }
})();
</script>

<!-- O loader é carregado diretamente pelo HTML, após a configuração. -->
<script
    src="https://cdn.emulatorjs.org/stable/data/loader.js"
    onerror="window.playerShowError('O navegador não conseguiu carregar o loader.js. Recarregue a página e tente novamente. Verifique também se o endereço do CDN está acessível.');">
</script>
</head>

<body>
<div id="game"></div>

<button id="backButton" type="button">← Voltar</button>

<div id="startScreen">
    <div id="gameTitle">Carregando jogo...</div>
    <button id="startButton" type="button">▶ INICIAR JOGO</button>
    <div id="loadingText">Preparando o jogo...</div>
</div>

<div id="errorScreen">
    <div id="errorTitle">Erro ao carregar o jogo</div>
    <div id="errorMessage"></div>
    <button id="errorBack" type="button">← Voltar</button>
</div>

<div id="rotateScreen">
    <div style="font-size:48px;margin-bottom:15px">📱↔️</div>
    Gire o celular para a horizontal para jogar.
</div>

<script>
(function () {
    "use strict";

    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const loadingText = document.getElementById("loadingText");
    const backButton = document.getElementById("backButton");

    function showError(message) {
        startScreen.style.display = "none";
        document.getElementById("errorScreen").style.display = "flex";
        document.getElementById("errorMessage").textContent = message;
    }

    window.playerShowError = showError;

    if (window.playerConfigError) {
        showError(window.playerConfigError);
    }

    startButton.addEventListener("click", async function () {
        startScreen.style.display = "none";

        try {
            if (document.documentElement.requestFullscreen) {
                await document.documentElement.requestFullscreen();
            }
        } catch (_) {}

        try {
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock("landscape");
            }
        } catch (_) {}
    });

    function goBack() {
        location.href = "index.html";
    }

    backButton.addEventListener("click", goBack);
    document.getElementById("errorBack").addEventListener("click", goBack);

    let hideTimer;

    function showBackButton() {
        backButton.classList.remove("hidden");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
            backButton.classList.add("hidden");
        }, 3500);
    }

    document.addEventListener("pointerdown", showBackButton, {
        passive: true
    });
})();
</script>
</body>
</html>
